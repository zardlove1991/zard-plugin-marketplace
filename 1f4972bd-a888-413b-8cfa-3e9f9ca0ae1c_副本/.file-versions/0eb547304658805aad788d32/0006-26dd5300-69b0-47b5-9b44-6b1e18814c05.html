<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pill Nav</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px 16px; background: #141416;
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage { width: min(100%, 720px); display: flex; justify-content: center; }
  .hint { margin: 0; font: 500 13px/1.5 ui-sans-serif, system-ui, sans-serif; color: rgba(244,244,245,.55); text-align: center; }

  /* ---------- component ---------- */
  .pill-nav {
    --pn-surface: rgba(38,35,46,.66);
    --pn-edge: rgba(255,255,255,.08);
    --pn-rim: rgba(255,255,255,.07);
    --pn-shadow: 0 22px 44px -20px rgba(0,0,0,.8), 0 6px 16px -8px rgba(0,0,0,.5);
    --pn-text: rgba(244,244,245,.64);
    --pn-strong: #f4f4f5;
    --pn-pill: #2563eb;
    --pn-pill-ink: #ffffff;
    --pn-pill-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px -6px rgba(0,0,0,.45);
    --pn-dot: #2563eb;
    --pn-ring: rgba(244,244,245,.55);
    --pn-row-hover: rgba(255,255,255,.06);
    --pn-tile: linear-gradient(180deg,#3a3644 0%,#27242f 100%);
    --pn-tile-rim: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.12), 0 4px 10px -4px rgba(0,0,0,.7);
    --pn-blur: blur(20px) saturate(1.6);
    --pn-h: 44px; --pn-pad: 4px; --pn-inner: 36px; --pn-x: 16px;
    --pn-font: 14px; --pn-gap: 8px; --pn-mark: 22px;
    --pn-roll: calc(var(--pn-inner) / 2 + 0.7em);
    position: relative; display: inline-flex; align-items: center; gap: var(--pn-gap);
    max-width: 100%; font-size: var(--pn-font); line-height: 1; -webkit-tap-highlight-color: transparent;
  }
  .pill-nav__surface { background: var(--pn-surface); box-shadow: var(--pn-shadow); -webkit-backdrop-filter: var(--pn-blur); backdrop-filter: var(--pn-blur); }
  .pill-nav__rim { position: absolute; inset: 0; z-index: 4; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px var(--pn-edge), inset 0 1px 0 var(--pn-rim); }
  .pill-nav__logo { position: relative; z-index: 2; display: inline-grid; flex: none; place-items: center; width: var(--pn-h); height: var(--pn-h); border-radius: 999px; }
  .pill-nav__logo-link { position: absolute; inset: 0; display: grid; place-items: center; border-radius: inherit; color: var(--pn-strong); text-decoration: none; outline: none; }
  .pill-nav__logo-link:focus-visible, .pill-nav__toggle:focus-visible { outline: 2px solid var(--pn-ring); outline-offset: 2px; }
  .pill-nav__mark { display: grid; place-items: center; width: var(--pn-mark); height: var(--pn-mark); }
  .pill-nav__mark svg { display: block; width: 100%; height: 100%; }
  .pill-nav__bar { position: relative; z-index: 1; display: flex; align-items: center; min-width: 0; height: var(--pn-h); padding: var(--pn-pad); border-radius: 999px; box-sizing: border-box; }
  .pill-nav__track { position: relative; height: 100%; }
  .pill-nav__list { display: flex; align-items: stretch; gap: 3px; height: 100%; margin: 0; padding: 0; list-style: none; }
  .pill-nav__slot { display: flex; }
  .pill-nav__item {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    height: 100%; padding: 0 var(--pn-x); border: 0; border-radius: 999px;
    background: var(--pn-tile); box-shadow: var(--pn-tile-rim); color: var(--pn-strong);
    font-family: inherit; font-size: inherit; line-height: inherit; font-weight: 500;
    letter-spacing: -.005em; white-space: nowrap; text-decoration: none; cursor: pointer;
    outline: none; overflow: hidden; isolation: isolate; transition: color .25s ease;
  }
  .pill-nav__item:focus-visible { outline: 2px solid var(--pn-ring); outline-offset: -2px; }
  .pill-nav__face { display: inline-flex; align-items: center; transition: transform .36s cubic-bezier(.22,1,.36,1); }
  .pill-nav__face-alt { position: absolute; inset: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--pn-pill-ink); transform: translateY(var(--pn-roll)); transition: transform .36s cubic-bezier(.22,1,.36,1); }
  .pill-nav__fill { position: absolute; top: 100%; left: 50%; z-index: -1; width: var(--pn-fill,200%); height: var(--pn-fill,200%); margin: calc(var(--pn-fill,200%)/-2) 0 0 calc(var(--pn-fill,200%)/-2); border-radius: 50%; background: var(--pn-pill); transform: scale(0); transition: transform .36s cubic-bezier(.4,0,.2,1); pointer-events: none; }
  .pill-nav__slot[data-hover] .pill-nav__face { transform: translateY(calc(var(--pn-roll) * -1)); transition-duration: .5s; }
  .pill-nav__slot[data-hover] .pill-nav__face-alt { transform: translateY(0); transition-duration: .5s; }
  .pill-nav__slot[data-hover] .pill-nav__fill { transform: scale(1); transition: transform .55s cubic-bezier(.22,1,.36,1); }
  .pill-nav__slot[data-on] .pill-nav__item { color: var(--pn-pill-ink); }
  .pill-nav__dot { position: absolute; bottom: calc((var(--pn-inner) - var(--pn-font)) / 4 - 2px); left: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 999px; background: var(--pn-dot); opacity: 0; pointer-events: none; will-change: transform, opacity; }
  .pill-nav__toggle { position: relative; z-index: 3; display: inline-grid; flex: none; place-items: center; width: var(--pn-h); height: var(--pn-h); padding: 0; border: 0; border-radius: 999px; color: var(--pn-strong); cursor: pointer; outline: none; }
  .pill-nav__burger { position: relative; width: 16px; height: 10px; }
  .pill-nav__line { position: absolute; left: 0; width: 100%; height: 1.5px; border-radius: 2px; background: currentColor; transition: transform .45s cubic-bezier(.22,1,.36,1), top .45s cubic-bezier(.22,1,.36,1); }
  .pill-nav__line--top { top: 1.5px; }
  .pill-nav__line--bottom { top: 7px; }
  .pill-nav[data-open] .pill-nav__line--top { top: 4.25px; transform: rotate(45deg); }
  .pill-nav[data-open] .pill-nav__line--bottom { top: 4.25px; transform: rotate(-45deg); }
  .pill-nav__panel { position: absolute; top: 0; right: 0; left: 0; z-index: 1; padding: calc(var(--pn-h) + 10px) 6px 6px; border-radius: 24px; box-sizing: border-box; }
  .pill-nav__menu { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .pill-nav__row { display: flex; align-items: center; width: 100%; height: calc(var(--pn-h) + 2px); padding: 0 16px; border: 0; border-radius: 18px; box-sizing: border-box; background: none; color: var(--pn-strong); font: inherit; font-size: calc(var(--pn-font) + 1px); font-weight: 500; text-align: left; text-decoration: none; cursor: pointer; outline: none; }
  .pill-nav__row:hover { background: var(--pn-row-hover); }
  .pill-nav__row[aria-current] { background: var(--pn-pill); box-shadow: var(--pn-pill-shadow); color: var(--pn-pill-ink); }
  @media (prefers-reduced-motion: reduce) { .pill-nav__face, .pill-nav__face-alt, .pill-nav__fill, .pill-nav__line { transition: none; } }
</style>
</head>
<body>

<div class="stage"><div id="mount"></div></div>
<p class="hint">悬停导航项，填充会从下方升起；窄屏自动折叠为菜单</p>

<script>
(function () {
  "use strict";

  const ITEMS = [
    { label: "Home", href: "/" },
    { label: "Journal", href: "/journal" },
    { label: "Photos", href: "/photos" },
    { label: "About", href: "/about" },
  ];
  const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="#f4f4f5" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 2.6 3 15.4 0 18M12 3C9 5.6 9 18.4 12 21"/></svg>';

  const mount = document.getElementById("mount");
  mount.innerHTML =
    '<nav class="pill-nav" id="nav" aria-label="Main">' +
      '<span class="pill-nav__logo pill-nav__surface" id="logo"><a class="pill-nav__logo-link" href="#" aria-label="维链通"><span class="pill-nav__mark" id="mark">' + LOGO + '</span></a><span class="pill-nav__rim"></span></span>' +
      '<div class="pill-nav__bar pill-nav__surface" id="bar"><div class="pill-nav__track" id="track"><ul class="pill-nav__list">' +
        ITEMS.map((it,i)=>'<li class="pill-nav__slot" data-index="'+i+'"><a class="pill-nav__item" href="'+it.href+'"'+(i===0?' aria-current="page" data-on':'')+'><span class="pill-nav__fill"></span><span class="pill-nav__face">'+it.label+'</span><span class="pill-nav__face-alt">'+it.label+'</span></a></li>').join("") +
      '</ul><span class="pill-nav__dot" id="dot"></span></div><span class="pill-nav__rim"></span></div>' +
      '<button class="pill-nav__toggle pill-nav__surface" id="toggle" type="button" aria-label="Open menu"><span class="pill-nav__burger"><span class="pill-nav__line pill-nav__line--top"></span><span class="pill-nav__line pill-nav__line--bottom"></span></span><span class="pill-nav__rim"></span></button>' +
      '<div class="pill-nav__panel pill-nav__surface" id="panel"><ul class="pill-nav__menu">' +
        ITEMS.map((it,i)=>'<li><a class="pill-nav__row" href="'+it.href+'"'+(i===0?' aria-current="page"':'')+'>'+it.label+'</a></li>').join("") +
      '</ul><span class="pill-nav__rim"></span></div>' +
    '</nav>';

  const nav = document.getElementById("nav");
  const bar = document.getElementById("bar");
  const track = document.getElementById("track");
  const slots = Array.from(nav.querySelectorAll(".pill-nav__slot"));
  const dot = document.getElementById("dot");
  const toggle = document.getElementById("toggle");
  const panel = document.getElementById("panel");
  const mark = document.getElementById("mark");

  let active = 0;
  let raf = 0, last = 0;
  const d = { x: 0, v: 0, alpha: 0 };

  function dotTarget() {
    const s = slots[active];
    if (!s) return 0;
    return s.offsetLeft + s.offsetWidth / 2;
  }
  function drawDot() {
    const pull = Math.min(2.2, Math.abs(d.v) / 700);
    dot.style.transform = "translate3d(" + d.x.toFixed(2) + "px,0,0) scaleX(" + (1 + pull).toFixed(3) + ")";
    dot.style.opacity = String(d.alpha);
  }
  function tick(now) {
    raf = 0;
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now;
    const target = dotTarget();
    const k = 360, zeta = 0.7;
    const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      d.v += (-k * (d.x - target) - 2 * zeta * Math.sqrt(k) * d.v) * h;
      d.x += d.v * h;
    }
    d.alpha += (1 - d.alpha) * (1 - Math.exp(-dt / 0.1));
    drawDot();
    if (Math.abs(d.x - target) > 0.05 || Math.abs(d.v) > 0.5 || d.alpha < 0.999) raf = requestAnimationFrame(tick);
  }
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function setActive(i) {
    if (i === active) return;
    active = i;
    slots.forEach((s, j) => {
      const a = s.querySelector(".pill-nav__item");
      if (j === i) { a.setAttribute("aria-current", "page"); s.setAttribute("data-on", ""); }
      else { a.removeAttribute("aria-current"); s.removeAttribute("data-on"); }
    });
    Array.from(panel.querySelectorAll(".pill-nav__row")).forEach((r, j) => {
      if (j === i) r.setAttribute("aria-current", "page"); else r.removeAttribute("aria-current");
    });
    wake();
  }
  slots.forEach((s, i) => {
    s.addEventListener("pointerenter", () => { s.setAttribute("data-hover", ""); });
    s.addEventListener("pointerleave", () => { s.removeAttribute("data-hover"); });
    s.addEventListener("click", () => setActive(i));
  });
  Array.from(panel.querySelectorAll(".pill-nav__row")).forEach((r, i) => r.addEventListener("click", () => setActive(i)));
  document.getElementById("logo").addEventListener("pointerenter", () => {
    if (mark.getAnimations().length) return;
    mark.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 900, easing: "cubic-bezier(.65,0,.25,1)" });
  });

  function evaluate() {
    const parent = nav.parentElement;
    const avail = parent.clientWidth;
    const need = 44 + 8 + ITEMS.length * 92;
    const collapse = need > avail;
    nav.toggleAttribute("data-collapsed", collapse);
    bar.style.display = collapse ? "none" : "";
    toggle.style.display = collapse ? "" : "none";
  }
  function toggleMenu() {
    const open = !nav.hasAttribute("data-open");
    nav.toggleAttribute("data-open", open);
    panel.style.display = open ? "block" : "none";
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  toggle.addEventListener("click", toggleMenu);
  document.addEventListener("pointerdown", e => {
    if (!nav.hasAttribute("data-open")) return;
    if (nav.contains(e.target)) return;
    nav.removeAttribute("data-open");
    panel.style.display = "none";
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && nav.hasAttribute("data-open")) {
      nav.removeAttribute("data-open");
      panel.style.display = "none";
      toggle.focus();
    }
  });
  panel.style.display = "none";
  new ResizeObserver(evaluate).observe(nav.parentElement);
  evaluate();

  // intro
  if (!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) {
    document.getElementById("logo").animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1)" }], { duration: 700, easing: "cubic-bezier(.34,1.56,.64,1)" });
    const w = bar.offsetWidth, h = bar.offsetHeight;
    bar.animate([{ clipPath: "inset(0px " + Math.max(0, w - h) + "px 0px 0px round " + h / 2 + "px)" }, { clipPath: "inset(0px 0px 0px 0px round " + h / 2 + "px)" }], { duration: 760, delay: 90, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards" });
    slots.forEach((s, i) => s.animate([{ opacity: 0, transform: "translateX(-10px)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 560, delay: 200 + i * 50, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards" }));
  }
  d.x = dotTarget(); d.alpha = 1; drawDot();
})();
</script>
</body>
</html>
