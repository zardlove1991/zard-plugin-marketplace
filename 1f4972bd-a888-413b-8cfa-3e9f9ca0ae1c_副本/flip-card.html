<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flip Card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 48px 16px;
    background: #f5f5f5;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .status {
    margin: 0;
    font: 500 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.01em;
    color: #8c8c8c;
  }

  /* ---------- component ---------- */
  .flip-card {
    --fc-w: 300px;
    --fc-h: 400px;
    --fc-radius: 22px;
    --fc-bg: #27272a;
    --fc-ink: #f5f5f5;
    --fc-shadow: #000000;
    --fc-shadow-o: 0.45;
    --fc-glare: 0.22;

    position: relative;
    display: inline-block;
    width: var(--fc-w);
    max-width: 100%;
    height: var(--fc-h);
    border-radius: var(--fc-radius);
    outline: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
  }
  .flip-card[data-axis='x'] { touch-action: pan-x; }
  .flip-card[data-draggable] { cursor: grab; }
  .flip-card[data-dragging] { cursor: grabbing; }
  .flip-card[data-disabled] { cursor: default; opacity: 0.6; }
  .flip-card__shadow {
    position: absolute;
    inset: 12% 9% -5%;
    border-radius: var(--fc-radius);
    background: color-mix(in srgb, var(--fc-shadow) calc(var(--fc-shadow-o) * 100%), transparent);
    filter: blur(22px);
    pointer-events: none;
  }
  .flip-card__rotor {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  .flip-card__face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: var(--fc-radius);
    background: var(--fc-bg);
    color: var(--fc-ink);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flip-card__face img { -webkit-user-drag: none; }
  .flip-card__face--back { transform: rotateY(180deg); }
  .flip-card[data-axis='x'] .flip-card__face--back { transform: rotateX(180deg); }
  .flip-card__glare {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle farthest-side at var(--fc-gx, 50%) var(--fc-gy, 50%),
      rgba(255, 255, 255, var(--fc-glare)) 0%,
      rgba(255, 255, 255, calc(var(--fc-glare) * 0.76)) 12%,
      rgba(255, 255, 255, calc(var(--fc-glare) * 0.5)) 26%,
      rgba(255, 255, 255, calc(var(--fc-glare) * 0.28)) 42%,
      rgba(255, 255, 255, calc(var(--fc-glare) * 0.12)) 60%,
      rgba(255, 255, 255, calc(var(--fc-glare) * 0.04)) 78%,
      rgba(255, 255, 255, 0) 100%
    );
    opacity: var(--fc-sheen, 0);
    pointer-events: none;
  }
  .flip-card[data-fade] .flip-card__face {
    transform: none;
    opacity: 0;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    transition: opacity 200ms ease;
  }
  .flip-card[data-fade='front'] .flip-card__face--front,
  .flip-card[data-fade='back'] .flip-card__face--back { opacity: 1; }
</style>
</head>

    <div class="flip-card__face flip-card__face--back" id="back" aria-hidden="true">
      <div style="padding:24px">
        <h3 style="margin:0 0 12px;font:600 22px/1.2 ui-sans-serif,system-ui,sans-serif">Wooded Landscape</h3>
        <p style="margin:0;font:400 14px/1.6 ui-sans-serif,system-ui,sans-serif;opacity:.72">Nature · Study No. 04</p>
      </div>
      <span class="flip-card__glare" aria-hidden="true"></span>
    </div>
  </div>
</div>

<p class="status" id="status">当前：正面 · 点击、拖拽或按 Enter 翻面</p>

<script>
(function () {
  "use strict";

  const SLOP = { fine: 4, coarse: 8 };
  const TILT_MAX = 12;
  const HOVER_SCALE = 1.03;
  const PERSPECTIVE = 1100;
  const STIFFNESS = 170;
  const DAMPING = 20;
  const FLING = 0.16;
  const WIDTH = 300;
  const HISTORY_MS = 90;
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  const card = document.getElementById("card");
  const rotor = document.getElementById("rotor");
  const shadow = document.getElementById("shadow");
  const front = document.getElementById("front");
  const back = document.getElementById("back");
  const status = document.getElementById("status");
  if (!card || !rotor || !shadow) return;

  let turn = 0;
  let tiltX = 0, tiltY = 0;
  let gx = 50, gy = 50;
  let sheen = 0, lift = 1;
  let grip = null;
  let spinRaf = 0;
  let shown = false;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const snap = deg => Math.round(deg / 180) * 180;
  const isBack = deg => Math.abs(Math.round(deg / 180)) % 2 === 1;

  function render() {
    if (reduce) {
      rotor.style.transform = "";
      card.dataset.fade = shown ? "back" : "front";
      shadow.style.transform = "";
      shadow.style.opacity = "1";
      return;
    }
    rotor.style.transform =
      "perspective(" + PERSPECTIVE + "px) scale(" + lift + ") rotateX(" + tiltX + "deg) rotateY(" + (turn + tiltY) + "deg)";
    rotor.style.setProperty("--fc-gx", gx + "%");
    rotor.style.setProperty("--fc-gy", gy + "%");
    rotor.style.setProperty("--fc-sheen", sheen);
    const facing = Math.abs(Math.cos((turn * Math.PI) / 180));
    shadow.style.transform = "scaleX(" + (0.08 + 0.92 * facing) + ")";
    shadow.style.opacity = String(0.1 + 0.9 * facing * facing);
  }
  function setShown(next) {
    shown = next;
    card.setAttribute("aria-pressed", String(next));
    front.setAttribute("aria-hidden", String(next));
    back.setAttribute("aria-hidden", String(!next));
    front.inert = next;
    back.inert = !next;
    status.textContent = "当前：" + (next ? "背面" : "正面") + " · 点击、拖拽或按 Enter 翻面";
  }
  function animateTo(to, velocity) {
    cancelAnimationFrame(spinRaf);
    if (reduce) { turn = to; render(); return; }
    let x = turn;
    let v = velocity || 0;
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 60);
      last = now;
      const a = -STIFFNESS * (x - to) - DAMPING * v;
      v += a * dt;
      x += v * dt;
      if (Math.abs(x - to) < 0.15 && Math.abs(v) < 0.6) {
        turn = to;
        render();
        return;
      }
      turn = x;
      render();
      spinRaf = requestAnimationFrame(frame);
    }
    spinRaf = requestAnimationFrame(frame);
  }
  function flip(instant) {
    const base = snap(turn);
    const to = isBack(base) ? base - 180 : base + 180;
    if (instant || reduce) {
      cancelAnimationFrame(spinRaf);
      turn = to;
      render();
    } else {
      animateTo(to, 0);
    }
    setShown(!shown);
  }
  function rest() {
    tiltX = 0; tiltY = 0; sheen = 0; lift = 1;
    render();
  }
  function velocityOf(hist) {
    if (hist.length < 2) return 0;
    const a = hist[0], b = hist[hist.length - 1];
    if (b.t <= a.t) return 0;
    return ((b.v - a.v) / (b.t - a.t)) * 1000;
  }

  card.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || grip) return;
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
    cancelAnimationFrame(spinRaf);
    grip = {
      id: e.pointerId, x: e.clientX, y: e.clientY, base: turn,
      moved: false, slop: e.pointerType === "touch" ? SLOP.coarse : SLOP.fine, hist: []
    };
    if (!reduce) { lift = HOVER_SCALE; render(); }
  });
  card.addEventListener("pointermove", function (e) {
    const g = grip;
    if (g && g.id === e.pointerId) {
      const d = e.clientX - g.x;
      if (!g.moved) {
        if (Math.abs(d) < g.slop || reduce) return;
        g.moved = true;
        card.dataset.dragging = "";
        tiltX = 0; tiltY = 0; sheen = 0;
      }
      turn = g.base + (d / WIDTH) * 180;
      const now = performance.now();
      g.hist.push({ t: now, v: turn });
      while (g.hist.length > 2 && now - g.hist[0].t > HISTORY_MS) g.hist.shift();
      render();
      return;
    }
    if (reduce || e.pointerType === "touch") return;
    const r = card.getBoundingClientRect();
    const px = clamp((e.clientX - r.left) / r.width, 0, 1);
    const py = clamp((e.clientY - r.top) / r.height, 0, 1);
    tiltX = (0.5 - py) * 2 * TILT_MAX;
    tiltY = (px - 0.5) * 2 * TILT_MAX;
    gx = px * 100; gy = py * 100; sheen = 1;
    render();
  });
  function release(e, cancelled) {
    const g = grip;
    if (!g || g.id !== e.pointerId) return;
    grip = null;
    delete card.dataset.dragging;
    try {
      if (card.hasPointerCapture(e.pointerId)) card.releasePointerCapture(e.pointerId);
    } catch (_) {}
    if (!g.moved) {
      if (!cancelled) flip(false);
      else animateTo(snap(g.base), 0);
      rest();
      return;
    }
    const v = cancelled ? 0 : velocityOf(g.hist);
    const base = snap(g.base);
    const to = cancelled ? base : clamp(snap(turn + v * FLING), base - 180, base + 180);
    setShown(isBack(to));
    animateTo(to, v);
    rest();
  }
  card.addEventListener("pointerup", function (e) { release(e, false); });
  card.addEventListener("pointercancel", function (e) { release(e, true); });
  card.addEventListener("lostpointercapture", function (e) { release(e, true); });
  card.addEventListener("pointerenter", function (e) {
    if (!reduce && e.pointerType !== "touch") { lift = HOVER_SCALE; render(); }
  });
  card.addEventListener("pointerleave", function () { if (!grip) rest(); });
  card.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (!e.repeat) flip(true);
  });
  card.addEventListener("click", function (e) { if (e.detail === 0) flip(true); });
  card.addEventListener("dragstart", function (e) { e.preventDefault(); });

  if (reduce) card.dataset.fade = "front";
  render();
})();
</script>
</body>
</html>
