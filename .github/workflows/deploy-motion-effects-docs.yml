name: Deploy Motion Effects Docs

on:
  push:
    branches: [main]
    paths:
      - 'plugins/motion-effects/docs/**'
      - 'plugins/motion-effects/skills/motion-effects/assets/**'
      - '.github/workflows/deploy-motion-effects-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-motion-effects
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/motion-effects/docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: plugins/motion-effects/docs
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build VitePress
        working-directory: plugins/motion-effects/docs
        env:
          # 项目页默认子路径；仓库变量 DOCS_BASE 可覆盖（自定义域名用 /）
          DOCS_BASE: ${{ vars.DOCS_BASE || '/zard-plugin-marketplace/' }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: plugins/motion-effects/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4