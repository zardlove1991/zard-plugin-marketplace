<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dock</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 32px 16px;
    background: radial-gradient(120% 120% at 50% 0%, #2b2b31, #16161a 72%);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #e7e7ea;
  }
  .intro { text-align: center; margin: 0; }
  .intro h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
  .intro p { margin: 0; font-size: 13px; opacity: 0.62; }
  .stage {
    position: relative;
    width: min(100%, 680px);
    height: 340px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: linear-gradient(180deg, #26262f 0%, #1a1a1f 100%);
    overflow: hidden;
  }
  .stage__hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-size: 13px; opacity: 0.45; pointer-events: none; }

  /* ---------- Dock 组件样式：与 React 原件的 .dock 规则一致 ---------- */
  .dock {
    position: absolute;
    z-index: 10;
    display: flex;
    gap: var(--dock-gap);
    box-sizing: border-box;
    padding: var(--dock-pad);
    border-radius: calc(var(--dock-base) * var(--dock-round) * 0.5 + var(--dock-pad));
    background: var(--dock-panel);
    box-shadow:
      inset 0 0 0 1px var(--dock-panel-edge),
      inset 0 1px 0 var(--dock-panel-highlight),
      var(--dock-panel-shadow);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    touch-action: none;
    transition:
      translate 0.5s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.2s ease;
  }
  .dock[data-hidden] {
    opacity: 0;
    pointer-events: none;
    transition:
      translate 0.36s cubic-bezier(0.55, 0, 0.75, 0.15),
      opacity 0.24s ease 0.1s;
  }
  .dock::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 42%);
    pointer-events: none;
  }
  .dock:hover::before { opacity: 0.9; }
  .dock--bottom, .dock--top { left: 50%; transform: translateX(-50%); }
  .dock--left, .dock--right { top: 50%; transform: translateY(-50%); }
  .dock--bottom { bottom: 18px; }
  .dock--top { top: 18px; }
  .dock--left { left: 18px; }
  .dock--right { right: 18px; }
  .dock--bottom[data-hidden] { translate: 0 120%; }
  .dock--top[data-hidden] { translate: 0 -120%; }
  .dock--left[data-hidden] { translate: -120% 0; }
  .dock--right[data-hidden] { translate: 120% 0; }
  .dock--bottom::before, .dock--top::before { background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 42%); }
  .dock--left::before, .dock--right::before { background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), transparent 42%); }
  .dock--bottom::before { bottom: 0; }
  .dock--top::before { top: 0; }
  .dock--left::before { left: 0; }
  .dock--right::before { right: 0; }
  .dock-item {
    position: relative;
    display: grid;
    place-items: center;
    width: var(--dock-base);
    height: var(--dock-base);
    flex: none;
    border: 0;
    padding: 0;
    background: none;
    color: var(--dock-ink);
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dock-item:hover, .dock-item:focus-visible { z-index: 2; }
  .dock-tile {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: calc(var(--dock-base) * var(--dock-round) * 0.42);
    background: var(--dock-tile);
    box-shadow:
      inset 0 0 0 1px var(--dock-tile-edge),
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      var(--dock-tile-shadow);
    overflow: hidden;
  }
  .dock-face {
    display: grid;
    place-items: center;
    width: 68%;
    height: 68%;
    border-radius: inherit;
    font-size: 22px;
    line-height: 1;
    color: var(--dock-ink);
    transform-origin: 50% 60%;
    transition: transform 0.12s ease-out;
  }
  .dock-face svg { width: 100%; height: 100%; }
  .dock--bare .dock-face { width: 100%; height: 100%; background: none; box-shadow: none; }
  .dock-item:active .dock-face, .dock-item[data-open] .dock-face { transform: scale(0.92); }
  .dock-item:focus-visible .dock-face { box-shadow: 0 0 0 2px var(--dock-accent); }
  .dock-badge {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--dock-badge);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  .dock-badge:empty { min-width: 8px; width: 8px; height: 8px; padding: 0; }
  .dock-dot {
    position: absolute;
    bottom: -7px;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dock-ink);
    transform: translateX(-50%);
  }
  .dock--bottom .dock-dot, .dock--top .dock-dot { bottom: -7px; }
  .dock--left .dock-dot, .dock--right .dock-dot { bottom: auto; top: 50%; left: -7px; transform: translateY(-50%); }
  .dock-label {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    padding: 5px 9px;
    border-radius: 8px;
    background: var(--dock-panel);
    border: 1px solid var(--dock-panel-edge);
    box-shadow: var(--dock-panel-shadow);
    color: var(--dock-ink);
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .dock-separator { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--dock-panel-edge); }

  /* ---------- 菜单 ---------- */
  .dock-menu {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    visibility: hidden;
    color: var(--dock-menu-ink);
    font-size: 13px;
    line-height: 1;
  }
  .dock-menu-shadow {
    position: absolute;
    inset: -9px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.35);
    filter: blur(12px);
  }
  .dock-menu-glass {
    position: absolute;
    inset: -9px;
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
    pointer-events: none;
  }
  .dock-menu-shape {
    position: absolute;
    top: -9px;
    left: -9px;
    width: calc(100% + 18px);
    height: calc(100% + 18px);
    overflow: visible;
    pointer-events: none;
  }
  .dock-menu-shape path { fill: var(--dock-menu); stroke: var(--dock-menu-edge); stroke-width: 1px; }
  .dock-menu-list {
    position: relative;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    min-width: 172px;
    max-width: 280px;
    padding: 6px;
    outline: none;
  }
  .dock-menu-highlight {
    position: absolute;
    left: 6px;
    right: 6px;
    top: 0;
    height: 0;
    border-radius: 8px;
    background: var(--dock-accent);
    opacity: 0;
    transition: transform 0.14s cubic-bezier(0.2, 1, 0.36, 1), height 0.14s ease, opacity 0.12s ease;
    pointer-events: none;
  }
  .dock-menu-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .dock-menu-row[data-active] { color: #fff; }
  .dock-menu-row[aria-disabled='true'] { opacity: 0.45; cursor: default; }
  .dock-menu-separator { height: 1px; margin: 5px 8px; background: var(--dock-menu-edge); }
  .dock-menu-check { display: grid; place-items: center; width: 12px; }
  .dock-menu-icon { display: grid; place-items: center; width: 14px; }
  .dock-menu-text { flex: 1; }
  .dock-menu-shortcut { color: var(--dock-menu-muted); font-size: 11px; }
  .dock-menu-chevron { display: grid; place-items: center; color: var(--dock-menu-muted); }

  /* ---------- 控制面板 ---------- */
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; width: min(100%, 680px); }
  .control { display: flex; align-items: center; gap: 8px; font-size: 12px; opacity: 0.82; }
  .control > span { letter-spacing: 0.02em; }
  .seg { display: inline-flex; gap: 2px; border-radius: 999px; padding: 3px; background: rgba(127, 127, 140, 0.16); }
  .seg button {
    border: none; border-radius: 999px; padding: 5px 11px;
    background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer;
  }
  .seg button.is-on { background: rgba(127, 127, 140, 0.34); }
  .control input[type="range"] { width: 110px; accent-color: #c8ff4d; }
  .control input[type="checkbox"] { accent-color: #c8ff4d; }
  .status { margin: 0; font: 500 12px/1.5 ui-monospace, monospace; opacity: 0.55; text-align: center; }
</style>
</head>
<body>
  <div class="intro">
    <h1>Dock</h1>
    <p>macOS 风格 Dock：指针靠近时图标按弹簧放大，点击弹跳，右键弹出玻璃质感菜单</p>
  </div>

  <div class="stage" id="stage">
    <p class="stage__hint">把指针移到 Dock 上</p>
  </div>

  <div class="controls">
    <label class="control">
      <span>停靠</span>
      <span class="seg" id="seg-position">
        <button type="button" data-value="bottom" class="is-on">底部</button>
        <button type="button" data-value="top">顶部</button>
        <button type="button" data-value="left">左侧</button>
        <button type="button" data-value="right">右侧</button>
      </span>
    </label>
    <label class="control">
      <span>主题</span>
      <span class="seg" id="seg-theme">
        <button type="button" data-value="dark" class="is-on">深色</button>
        <button type="button" data-value="light">浅色</button>
      </span>
    </label>
    <label class="control"><span>图标大小</span><input type="range" id="opt-base" min="30" max="80" step="2" value="50" /></label>
    <label class="control"><span>放大到</span><input type="range" id="opt-mag" min="50" max="140" step="2" value="70" /></label>
    <label class="control"><span>影响距离</span><input type="range" id="opt-dist" min="60" max="320" step="10" value="200" /></label>
    <label class="control"><span>条子厚度</span><input type="range" id="opt-thick" min="50" max="110" step="2" value="68" /></label>
    <label class="control"><span>间距</span><input type="range" id="opt-gap" min="0" max="30" step="1" value="10" /></label>
    <label class="control"><span>圆角</span><input type="range" id="opt-round" min="0" max="1" step="0.05" value="0.5" /></label>
    <label class="control"><span>点击弹跳</span><input type="checkbox" id="opt-bounce" checked /></label>
    <label class="control"><span>名称提示</span><input type="checkbox" id="opt-labels" checked /></label>
  </div>

  <p class="status" id="status">就绪</p>

<script>
(function () {
  var EDGE = 12;
  var HOP = 0.4;
  var HOP_TIME = 0.38;
  var HOLD_TIME = 450;
  var TAIL = 9;
  var TAIL_HALF = 9;
  var MENU_RADIUS = 10;
  var MENU_GAP = 8;
  var MARGIN = 8;

  var THEMES = {
    dark: {
      '--dock-panel': 'rgba(38, 35, 46, 0.66)',
      '--dock-panel-edge': 'rgba(255, 255, 255, 0.08)',
      '--dock-panel-highlight': 'rgba(255, 255, 255, 0.07)',
      '--dock-panel-shadow': '0 22px 44px -20px rgba(0, 0, 0, 0.8), 0 6px 16px -8px rgba(0, 0, 0, 0.5)',
      '--dock-tile': 'linear-gradient(180deg, #3a3644 0%, #27242f 100%)',
      '--dock-tile-edge': 'rgba(255, 255, 255, 0.07)',
      '--dock-tile-shadow': '0 4px 10px -4px rgba(0, 0, 0, 0.7)',
      '--dock-ink': '#f4f4f5',
      '--dock-muted': 'rgba(244, 244, 245, 0.55)',
      '--dock-menu': 'rgba(30, 28, 38, 0.82)',
      '--dock-menu-edge': 'rgba(255, 255, 255, 0.1)',
      '--dock-menu-ink': '#f4f4f5',
      '--dock-menu-muted': 'rgba(244, 244, 245, 0.55)'
    },
    light: {
      '--dock-panel': 'rgba(240, 240, 243, 0.8)',
      '--dock-panel-edge': 'rgba(24, 24, 27, 0.07)',
      '--dock-panel-highlight': 'rgba(255, 255, 255, 0.95)',
      '--dock-panel-shadow': '0 22px 44px -22px rgba(24, 24, 27, 0.3), 0 6px 16px -10px rgba(24, 24, 27, 0.16)',
      '--dock-tile': 'linear-gradient(180deg, #ffffff 0%, #f6f6f8 100%)',
      '--dock-tile-edge': 'rgba(24, 24, 27, 0.08)',
      '--dock-tile-shadow': '0 4px 10px -5px rgba(24, 24, 27, 0.25)',
      '--dock-ink': '#27272a',
      '--dock-muted': 'rgba(39, 39, 42, 0.55)',
      '--dock-menu': 'rgba(252, 252, 253, 0.86)',
      '--dock-menu-edge': 'rgba(24, 24, 27, 0.08)',
      '--dock-menu-ink': '#27272a',
      '--dock-menu-muted': 'rgba(39, 39, 42, 0.55)'
    }
  };

  var ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>'
  };

  var ITEMS = [
    { icon: 'home', label: '访达', menu: [
      { label: '新建窗口' },
      { separator: true },
      { label: '选项', items: [{ label: '登录时打开', checked: true }, { label: '在访达中显示' }] },
      { separator: true },
      { label: '退出' }
    ] },
    { icon: 'mail', label: '邮件', badge: 3 },
    { icon: 'music', label: '音乐' },
    { icon: 'settings', label: '系统设置' },
    { separator: true },
    { icon: 'trash', label: '废纸篓' }
  ];

  var clamp = function (value, min, max) { return Math.min(Math.max(value, min), Math.max(min, max)); };

  function menuPath(width, height, side, at) {
    var r = MENU_RADIUS;
    var p = function (x, y) { return (x + TAIL).toFixed(2) + ' ' + (y + TAIL).toFixed(2); };
    var tail = function (x, y, dx, dy, nx, ny) {
      var q = function (u, v) { return p(x + dx * u + nx * v, y + dy * u + ny * v); };
      return 'L ' + q(-TAIL_HALF, 0) + ' L ' + q(-TAIL_HALF * 0.18, TAIL * 0.82) +
        ' Q ' + q(0, TAIL) + ' ' + q(TAIL_HALF * 0.18, TAIL * 0.82) + ' L ' + q(TAIL_HALF, 0);
    };
    return [
      'M ' + p(r, 0),
      side === 'top' ? tail(at, 0, 1, 0, 0, -1) : '',
      'L ' + p(width - r, 0) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p(width, r),
      side === 'right' ? tail(width, at, 0, 1, 1, 0) : '',
      'L ' + p(width, height - r) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p(width - r, height),
      side === 'bottom' ? tail(at, height, -1, 0, 0, 1) : '',
      'L ' + p(r, height) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p(0, height - r),
      side === 'left' ? tail(0, at, 0, -1, -1, 0) : '',
      'L ' + p(0, r) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p(r, 0) + ' Z'
    ].join(' ');
  }

  function Dock(stage, options) {
    this.stage = stage;
    this.options = options;
    this.items = options.items || ITEMS;
    this.side = options.position || 'bottom';
    this.vertical = this.side === 'left' || this.side === 'right';
    this.motion = new Map();
    this.pointer = { x: 0, y: 0, inside: false };
    this.focused = -1;
    this.held = null;
    this.lastRest = [];
    this.lastFocus = null;
    this.raf = 0;
    this.last = 0;
    this.fit = 1;
    this.base = 50;
    this.build();
    this.start();
  }

  Dock.prototype.settings = function () {
    var o = this.options;
    var rawBase = Math.max(16, o.baseItemSize);
    var rawPeak = Math.max(rawBase, o.magnification);
    var rawThickness = Math.max(rawBase, o.panelHeight);
    var rawGap = Math.max(0, o.gap);
    var length =
      this.items.reduce(function (sum, item) { return sum + (item && item.separator ? 1 : rawBase); }, 0) +
      rawGap * Math.max(0, this.items.length - 1) +
      rawThickness - rawBase;
    return {
      rawBase: rawBase, rawPeak: rawPeak, rawThickness: rawThickness, rawGap: rawGap,
      base: rawBase * this.fit,
      peak: rawPeak * this.fit,
      thickness: rawThickness * this.fit,
      gap: rawGap * this.fit,
      distance: Math.max(1, o.distance) * this.fit,
      mass: Math.max(0.01, (o.spring && o.spring.mass) || 0.1),
      stiffness: Math.max(1, (o.spring && o.spring.stiffness) || 150),
      damping: Math.max(0, (o.spring && o.spring.damping) || 12)
    };
  };

  Dock.prototype.applyTheme = function () {
    var theme = this.options.theme === 'light' ? 'light' : 'dark';
    var tokens = THEMES[theme];
    var root = this.root;
    var s = this.settings();
    Object.keys(tokens).forEach(function (key) { root.style.setProperty(key, tokens[key]); });
    root.style.setProperty('--dock-accent', this.options.accentColor || '#0a84ff');
    root.style.setProperty('--dock-badge', this.options.badgeColor || '#ff453a');
    root.style.setProperty('--dock-base', s.base + 'px');
    root.style.setProperty('--dock-thickness', s.thickness + 'px');
    root.style.setProperty('--dock-gap', s.rawGap * this.fit + 'px');
    root.style.setProperty('--dock-pad', (s.thickness - s.base) / 2 + 'px');
    root.style.setProperty('--dock-reach', s.peak - s.base + 'px');
    root.style.setProperty('--dock-round', clamp(this.options.roundness, 0, 1));
  };

  Dock.prototype.build = function () {
    var self = this;
    this.root = document.createElement('div');
    this.root.className = 'dock dock--' + this.side + (this.options.tiles === false ? ' dock--bare' : '');
    this.root.setAttribute('role', 'toolbar');
    this.root.setAttribute('aria-label', 'Dock');
    this.root.setAttribute('aria-orientation', this.vertical ? 'vertical' : 'horizontal');
    this.items.forEach(function (item, index) {
      if (item.separator) {
        var sep = document.createElement('span');
        sep.className = 'dock-separator';
        sep.setAttribute('aria-hidden', 'true');
        self.root.appendChild(sep);
        return;
      }
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'dock-item';
      button.setAttribute('aria-label', item.label);
      var tile = document.createElement('span');
      tile.className = 'dock-tile';
      var face = document.createElement('span');
      face.className = 'dock-face';
      face.innerHTML = ICONS[item.icon] || '';
      tile.appendChild(face);
      if (self.options.showBadges !== false && item.badge !== undefined) {
        var badge = document.createElement('span');
        badge.className = 'dock-badge';
        badge.textContent = item.badge === true ? '' : String(item.badge);
        tile.appendChild(badge);
      }
      button.appendChild(tile);
      if (self.options.showIndicators !== false && item.active) {
        var dot = document.createElement('span');
        dot.className = 'dock-dot';
        dot.setAttribute('aria-hidden', 'true');
        button.appendChild(dot);
      }
      if (self.options.showLabels !== false && item.label) {
        var label = document.createElement('span');
        label.className = 'dock-label';
        label.setAttribute('aria-hidden', 'true');
        label.textContent = item.label;
        button.appendChild(label);
      }
      button.addEventListener('click', function () { self.hop(index); });
      button.addEventListener('contextmenu', function (event) {
        if (!item.menu || !item.menu.length) return;
        event.preventDefault();
        self.openMenu(index, item.menu);
      });
      self.root.appendChild(button);
      self.items[index] = item;
    });
    this.stage.appendChild(this.root);
    this.applyTheme();
  };

  Dock.prototype.entry = function (index) {
    var state = this.motion.get(index);
    if (!state) {
      state = { size: this.settings().base, velocity: 0, lift: 0, rise: 0, launch: 0, gravity: 0, hopping: false, drawn: '' };
      this.motion.set(index, state);
    }
    return state;
  };

  Dock.prototype.tick = function () {
    this.raf = 0;
    var self = this;
    var s = this.settings();
    var now = performance.now();
    var dt = Math.min(1 / 30, Math.max(0.001, (now - this.last) / 1000));
    this.last = now;
    var root = this.root;
    var rect = root.getBoundingClientRect();
    // 指针换算成宿主内的布局像素：页面被 CSS zoom 放大时 rect 是放大后的值
    var zoom = root.offsetWidth ? rect.width / root.offsetWidth : 1;
    var center = this.vertical ? root.offsetHeight / 2 : root.offsetWidth / 2;
    var spans = this.items.map(function (item) { return item && item.separator ? 1 : s.base; });
    var cursor = -(spans.reduce(function (sum, span) { return sum + span; }, 0) + s.gap * Math.max(0, spans.length - 1)) / 2;
    var rest = spans.map(function (span) {
      var middle = cursor + span / 2;
      cursor += span + s.gap;
      return middle;
    });
    var focus = null;
    if (this.held !== null) focus = this.held;
    else if (this.pointer.inside) {
      var local = this.vertical ? (this.pointer.y - rect.top) / zoom : (this.pointer.x - rect.left) / zoom;
      focus = local - center;
    } else if (rest[this.focused] !== undefined) focus = rest[this.focused];
    this.lastFocus = focus;
    this.lastRest = rest;
    var steps = Math.max(1, Math.ceil(dt * 240));
    var h = dt / steps;
    var k = s.stiffness / s.mass;
    var c = s.damping / s.mass;
    var moving = false;
    var nodes = this.root.querySelectorAll('.dock-item');
    this.items.forEach(function (item, index) {
      var node = nodes[index];
      if (!node || (item && item.separator)) return;
      var state = self.entry(index);
      var reach = focus === null ? 1 : Math.abs(focus - rest[index]) / s.distance;
      var target = s.base + (s.peak - s.base) * (reach < 1 ? Math.pow(Math.cos((reach * Math.PI) / 2), 2) : 0);
      for (var i = 0; i < steps; i++) {
        state.velocity = (state.velocity + h * k * (target - state.size)) / (1 + h * c + h * h * k);
        state.size += state.velocity * h;
        if (!state.hopping) continue;
        state.rise -= state.gravity * h;
        state.lift += state.rise * h;
        if (state.lift > 0) continue;
        state.lift = 0;
        state.rise *= -0.36;
        if (state.rise < state.launch * 0.2) {
          state.rise = 0;
          state.hopping = false;
          node.removeAttribute('data-hop');
        }
      }
      if (Math.abs(state.velocity) < 0.01 && Math.abs(target - state.size) < 0.01) {
        state.size = target;
        state.velocity = 0;
      } else {
        moving = true;
      }
      if (state.hopping) moving = true;
      var size = Math.max(1, state.size);
      var drawn = size.toFixed(2) + ' ' + state.lift.toFixed(2) + ' ' + self.side;
      if (drawn === state.drawn) return;
      state.drawn = drawn;
      var lift = self.side === 'bottom' || self.side === 'right' ? -state.lift : state.lift;
      var tile = node.firstElementChild;
      node.style.width = size + 'px';
      node.style.height = size + 'px';
      if (tile) tile.style.transform = 'translate(' + (self.vertical ? lift + 'px, 0' : '0, ' + lift + 'px') + ') scale(' + (size / s.base) + ')';
    });
    if (moving) this.raf = requestAnimationFrame(this.tick.bind(this));
  };

  Dock.prototype.wake = function () {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick.bind(this));
  };

  Dock.prototype.hop = function (index) {
    if (!this.options.bounce) return;
    var node = this.root.querySelectorAll('.dock-item')[index];
    if (!node) return;
    var state = this.entry(index);
    if (state.hopping) return;
    var height = state.size * HOP;
    state.gravity = (8 * height) / (HOP_TIME * HOP_TIME);
    state.launch = (state.gravity * HOP_TIME) / 2;
    state.rise = state.launch;
    state.hopping = true;
    node.setAttribute('data-hop', '');
    this.wake();
  };

  Dock.prototype.openMenu = function (index, rows) {
    this.closeMenu();
    var node = this.root.querySelectorAll('.dock-item')[index];
    if (!node) return;
    var rect = node.getBoundingClientRect();
    var side = this.side;
    var point = {
      bottom: { x: rect.left + rect.width / 2, y: rect.top - MENU_GAP },
      top: { x: rect.left + rect.width / 2, y: rect.bottom + MENU_GAP },
      left: { x: rect.right + MENU_GAP, y: rect.top + rect.height / 2 },
      right: { x: rect.left - MENU_GAP, y: rect.top + rect.height / 2 }
    }[side];
    var menu = document.createElement('div');
    menu.className = 'dock-menu';
    menu.setAttribute('data-dock-menu', '');
    var theme = this.options.theme === 'light' ? 'light' : 'dark';
    Object.keys(THEMES[theme]).forEach(function (key) { menu.style.setProperty(key, THEMES[theme][key]); });
    menu.style.setProperty('--dock-accent', this.options.accentColor || '#0a84ff');
    var shadow = document.createElement('span');
    shadow.className = 'dock-menu-shadow';
    var glass = document.createElement('span');
    glass.className = 'dock-menu-glass';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'dock-menu-shape');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    svg.appendChild(path);
    var list = document.createElement('div');
    list.className = 'dock-menu-list';
    list.setAttribute('role', 'menu');
    var self = this;
    rows.forEach(function (row) {
      if (row.separator) {
        var sep = document.createElement('span');
        sep.className = 'dock-menu-separator';
        sep.setAttribute('role', 'separator');
        list.appendChild(sep);
        return;
      }
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'dock-menu-row';
      button.setAttribute('role', row.checked !== undefined ? 'menuitemcheckbox' : 'menuitem');
      if (row.checked !== undefined) button.setAttribute('aria-checked', String(!!row.checked));
      var check = document.createElement('span');
      check.className = 'dock-menu-check';
      if (row.checked) check.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 8.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      button.appendChild(check);
      var text = document.createElement('span');
      text.className = 'dock-menu-text';
      text.textContent = row.label || '';
      button.appendChild(text);
      if (row.items && row.items.length) {
        var chevron = document.createElement('span');
        chevron.className = 'dock-menu-chevron';
        chevron.innerHTML = '<svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3.5L10.5 8 6 12.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        button.appendChild(chevron);
      }
      button.addEventListener('click', function () {
        if (row.items && row.items.length) {
          self.openMenu(index, row.items);
          return;
        }
        self.closeMenu();
        statusEl.textContent = '选中菜单项：' + (row.label || '');
      });
      list.appendChild(button);
    });
    menu.appendChild(shadow);
    menu.appendChild(glass);
    menu.appendChild(svg);
    menu.appendChild(list);
    document.body.appendChild(menu);
    var width = list.offsetWidth;
    var height = list.offsetHeight;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var left;
    var top;
    var at = 0;
    if (side === 'bottom' || side === 'top') {
      left = clamp(point.x - width / 2, MARGIN, vw - MARGIN - width);
      top = side === 'bottom' ? point.y - TAIL - height : point.y + TAIL;
      at = clamp(point.x - left, MENU_RADIUS + TAIL_HALF, width - MENU_RADIUS - TAIL_HALF);
    } else {
      top = clamp(point.y - height / 2, MARGIN, vh - MARGIN - height);
      left = side === 'right' ? point.x - TAIL - width : point.x + TAIL;
      at = clamp(point.y - top, MENU_RADIUS + TAIL_HALF, height - MENU_RADIUS - TAIL_HALF);
    }
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.visibility = 'visible';
    var d = menuPath(width, height, side, at);
    glass.style.clipPath = "path('" + d + "')";
    path.setAttribute('d', d);
    this.menu = menu;
  };

  Dock.prototype.closeMenu = function () {
    if (this.menu) {
      this.menu.remove();
      this.menu = null;
    }
  };

  Dock.prototype.start = function () {
    var self = this;
    var root = this.root;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.lastBase = this.settings().base;
    var measure = function () {
      var s = self.settings();
      var room = (self.vertical ? self.stage.clientHeight : self.stage.clientWidth) - EDGE * 2;
      var next = Math.min(1, Math.max(0.4, room / Math.max(1, s.base * self.items.length)));
      self.fit = Math.round(next * 1000) / 1000;
      self.applyTheme();
      self.wake();
    };
    measure();
    if (typeof ResizeObserver === 'function') {
      this.observer = new ResizeObserver(measure);
      this.observer.observe(this.stage);
    }
    root.addEventListener('pointermove', function (event) {
      self.pointer.x = event.clientX;
      self.pointer.y = event.clientY;
      self.pointer.inside = true;
      self.wake();
    });
    root.addEventListener('pointerleave', function () {
      self.pointer.inside = false;
      self.wake();
    });
    root.addEventListener('pointerdown', function (event) {
      self.pointer.x = event.clientX;
      self.pointer.y = event.clientY;
      self.pointer.inside = true;
      self.wake();
    });
    this.reduce = reduce;
    this.wake();
  };

  /* ---------- 页面装配 ---------- */
  var statusEl = document.getElementById('status');
  var stage = document.getElementById('stage');
  var dock = new Dock(stage, {
    items: ITEMS,
    position: 'bottom',
    theme: 'dark',
    baseItemSize: 50,
    magnification: 70,
    distance: 200,
    panelHeight: 68,
    gap: 10,
    roundness: 0.5,
    spring: { mass: 0.1, stiffness: 150, damping: 12 },
    bounce: true,
    tiles: true,
    showLabels: true,
    showIndicators: true,
    showBadges: true,
    badgeColor: '#ff453a',
    accentColor: '#0a84ff'
  });

  function bindSegment(id, key, after) {
    var group = document.getElementById(id);
    group.addEventListener('click', function (event) {
      var button = event.target.closest('button[data-value]');
      if (!button) return;
      Array.prototype.forEach.call(group.querySelectorAll('button'), function (item) {
        item.classList.toggle('is-on', item === button);
      });
      dock.options[key] = button.getAttribute('data-value');
      if (key === 'position') {
        dock.side = dock.options.position;
        dock.vertical = dock.side === 'left' || dock.side === 'right';
        dock.root.className = 'dock dock--' + dock.side + (dock.options.tiles === false ? ' dock--bare' : '');
        dock.root.setAttribute('aria-orientation', dock.vertical ? 'vertical' : 'horizontal');
      }
      if (after) after();
      dock.applyTheme();
      dock.wake();
    });
  }
  bindSegment('seg-position', 'position');
  bindSegment('seg-theme', 'theme');

  function bindRange(id, key) {
    var input = document.getElementById(id);
    input.addEventListener('input', function () {
      dock.options[key] = Number(input.value);
      dock.applyTheme();
      dock.wake();
      statusEl.textContent = key + ' = ' + input.value;
    });
  }
  bindRange('opt-base', 'baseItemSize');
  bindRange('opt-mag', 'magnification');
  bindRange('opt-dist', 'distance');
  bindRange('opt-thick', 'panelHeight');
  bindRange('opt-gap', 'gap');
  bindRange('opt-round', 'roundness');

  document.getElementById('opt-bounce').addEventListener('change', function (event) {
    dock.options.bounce = event.target.checked;
  });
  document.getElementById('opt-labels').addEventListener('change', function (event) {
    dock.options.showLabels = event.target.checked;
    Array.prototype.forEach.call(dock.root.querySelectorAll('.dock-label'), function (label) {
      label.style.display = event.target.checked ? '' : 'none';
    });
  });
  stage.addEventListener('pointerdown', function (event) {
    if (event.target === stage) dock.closeMenu();
  });
})();
</script>
</body>
</html>
