<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reflective Card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px 16px; background: #0e0e11;
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .hint { margin: 0; font: 500 13px/1.5 ui-sans-serif, system-ui, sans-serif; color: rgba(244,244,245,.55); text-align: center; }

  .reflective-card {
    position: relative; box-sizing: border-box;
    width: 320px; height: 500px; max-width: 100%;
    perspective: 900px; color: #f4f4f5;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .reflective-card__body {
    position: relative; box-sizing: border-box; width: 100%; height: 100%;
    overflow: hidden; border-radius: 24px; background: #1d1c22;
    box-shadow: 0 22px 44px -20px rgba(0,0,0,.8), 0 6px 16px -8px rgba(0,0,0,.5);
    transform: translate3d(0, var(--rc-lift, 0px), 0) rotateX(var(--rc-rotate-x, 0deg)) rotateY(var(--rc-rotate-y, 0deg));
    opacity: var(--rc-presence, 1); isolation: isolate; will-change: transform;
  }
  .reflective-card__canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .reflective-card__content {
    position: relative; z-index: 1; box-sizing: border-box;
    display: flex; height: 100%; flex-direction: column; padding: 19px;
  }
  .reflective-card__header { display: flex; align-items: center; gap: 12px; font-size: 13px; line-height: 20px; }
  .reflective-card__badge { display: inline-flex; align-items: center; gap: 6px; color: #f4f4f5; font-weight: 500; }
  .reflective-card__status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: rgba(244,244,245,.6); }
  .reflective-card__dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .reflective-card__identity { margin-top: auto; }
  .reflective-card__name { margin: 0; color: #f4f4f5; font-size: 24px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; }
  .reflective-card__role { margin: 4px 0 0; color: rgba(244,244,245,.6); font-size: 14px; line-height: 1.4; }
  .reflective-card__footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 24px; }
  .reflective-card__id { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
  .reflective-card__label { color: rgba(244,244,245,.6); font-size: 12px; line-height: 16px; }
  .reflective-card__value {
    overflow: hidden; color: #f4f4f5; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 20px;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .reflective-card__tile {
    position: relative; box-sizing: border-box; display: flex; width: 44px; height: 44px; flex: none;
    align-items: center; justify-content: center; border-radius: 12px;
    background: linear-gradient(180deg,#3a3644 0%,#27242f 100%);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,.7); color: rgba(244,244,245,.6);
  }
  .reflective-card__tile::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .reflective-card__rim {
    position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.1);
  }
  @media (max-width: 400px) { .reflective-card { width: min(100%, 320px); height: 460px; } }
</style>
</head>
<body>

<div class="reflective-card" id="root">
  <div class="reflective-card__body" id="body">
    <canvas class="reflective-card__canvas" id="canvas" aria-hidden="true"></canvas>
    <div class="reflective-card__content">
      <div class="reflective-card__header">
        <span class="reflective-card__badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 12 3 3 7-7"/><path d="M12 3 4 6v5c0 5 3.4 8.3 8 10 4.6-1.7 8-5 8-10V6Z"/></svg>
          Verified
        </span>
        <span class="reflective-card__status"><span class="reflective-card__dot"></span>Active</span>
      </div>
      <div class="reflective-card__identity">
        <h3 class="reflective-card__name">维链通</h3>
        <p class="reflective-card__role">品牌 CI 中心</p>
      </div>
      <div class="reflective-card__footer">
        <div class="reflective-card__id">
          <span class="reflective-card__label">品牌编号</span>
          <span class="reflective-card__value">8901 2345 6789</span>
        </div>
        <span class="reflective-card__tile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3c-3 0-5 2-5 5v2M12 3c3 0 5 2 5 5v2M7 10v3M17 10v3M5 12v3a7 7 0 0 0 14 0v-3M9 21h6"/></svg>
        </span>
      </div>
    </div>
    <span class="reflective-card__rim"></span>
  </div>
</div>
<p class="hint">移动光标，金属面会随之倾斜并反射影棚光</p>

<script>
(function () {
  "use strict";

  const VERTEX = `#version 300 es
in vec2 aPosition;
out vec2 vUv;
void main(){vUv=aPosition*0.5+0.5;gl_Position=vec4(aPosition,0.0,1.0);}`;

  const PLATE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform vec2 uSize;
uniform float uRadius;
uniform float uScale;
uniform mat3 uRotate;
uniform vec3 uTint;
uniform float uRough;
uniform float uMetal;
uniform float uBlur;
uniform float uWarp;
uniform float uWarpScale;
uniform float uShine;
uniform float uBevel;
uniform float uGlare;
uniform vec2 uPointer;
const float VIEW = 900.0;
const float CONTENT = 46.0;
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash2(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.103,0.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy)*2.0-1.0;}
vec3 gradientNoise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
  vec2 du=30.0*f*f*(f*(f-2.0)+1.0);
  vec2 ga=hash2(i),gb=hash2(i+vec2(1.0,0.0)),gc=hash2(i+vec2(0.0,1.0)),gd=hash2(i+vec2(1.0,1.0));
  float va=dot(ga,f),vb=dot(gb,f-vec2(1.0,0.0)),vc=dot(gc,f-vec2(0.0,1.0)),vd=dot(gd,f-vec2(1.0,1.0));
  float k=va-vb-vc+vd;
  float value=va+u.x*(vb-va)+u.y*(vc-va)+u.x*u.y*k;
  vec2 slope=ga+u.x*(gb-ga)+u.y*(gc-ga)+u.x*u.y*(ga-gb-gc+gd)+du*(u.yx*k+vec2(vb,vc)-va);
  return vec3(value,slope);
}
float valueNoise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);
}
float erf(float x){float x2=x*x;return sign(x)*sqrt(1.0-exp(-x2*(1.2732395+0.147*x2)/(1.0+0.147*x2)));}
float band(float x,float hw,float sigma){float s=1.4142136*max(sigma,0.0001);return 0.5*(erf((x+hw)/s)-erf((x-hw)/s));}
float strip(vec2 q,vec2 c,vec2 dir,float hw,vec2 sigma){vec2 n=vec2(-dir.y,dir.x);return band(dot(q-c,n),hw,length(sigma*n));}
const vec2 SWEEP=vec2(0.5,0.86);
float softbox(vec2 q,vec2 sigma){
  float key=strip(q,vec2(-0.1,-0.16),normalize(SWEEP),0.022,sigma+0.018);
  float top=band(q.y+0.6,0.12,sigma.y+0.05);
  float side=band(q.x-0.46,0.05,sigma.x+0.05);
  return key+top*0.8+side*0.35;
}
float room(vec2 q,vec2 sigma){
  float fall=smoothstep(-0.55,0.5,q.y);
  float flag=strip(q,vec2(0.24,-0.02),normalize(SWEEP),0.09,sigma+0.08);
  return mix(0.85,0.12,fall)*(1.0-0.6*flag);
}
void main(){
  vec2 p=vec2(vUv.x-0.5,0.5-vUv.y)*uSize;
  vec2 halfSize=uSize*0.5;
  float r=min(uRadius,min(halfSize.x,halfSize.y));
  vec2 corner=abs(p)-halfSize+r;
  vec2 side=vec2(p.x>=0.0?1.0:-1.0,p.y>=0.0?1.0:-1.0);
  float d; vec2 outward;
  if(corner.x>0.0&&corner.y>0.0){d=length(corner)-r;outward=normalize(corner)*side;}
  else if(corner.x>corner.y){d=corner.x-r;outward=vec2(side.x,0.0);}
  else{d=corner.y-r;outward=vec2(0.0,side.y);}
  float coverage=clamp(0.5-d*uScale,0.0,1.0);
  float chamferWidth=min(uBevel,max(r,1.0));
  float chamfer=chamferWidth>0.01?1.0-smoothstep(0.0,chamferWidth,-d):0.0;
  vec2 slope=outward*chamfer;
  vec2 wp=p/(220.0*uWarpScale);
  vec3 w1=gradientNoise(wp);
  vec3 w2=gradientNoise(wp*2.07+13.7);
  vec2 ripple=(w1.yz+w2.yz*0.5)*uWarp;
  slope+=ripple*0.008;
  float grain=valueNoise(vec2(p.x*0.008,p.y*0.55))*0.45+valueNoise(vec2(p.x*0.019+3.7,p.y*0.23))*0.35+valueNoise(vec2(p.x*0.004+9.2,p.y*0.09))*0.2;
  float brush=uRough*uRough;
  slope.y+=(grain-0.5)*brush*0.004;
  vec3 normal=uRotate*normalize(vec3(slope,1.0));
  vec3 position=uRotate*vec3(p,0.0);
  vec3 view=normalize(position-vec3(0.0,0.0,VIEW));
  vec3 bounce=reflect(view,normal);
  vec2 q=bounce.xy/max(bounce.z,0.2);
  vec2 footprint=fwidth(q);
  vec2 sigma=sqrt(vec2(uBlur/VIEW)*vec2(uBlur/VIEW)+footprint*footprint*0.5);
  sigma+=vec2(0.004,0.05)*uRough;
  vec3 scene=vec3(room(q,sigma));
  scene*=1.0+(grain-0.5)*brush*0.3;
  vec2 toPointer=(uPointer-p)/(120.0+uBlur*4.0);
  vec2 spread=toPointer*vec2(1.0,1.0/(1.0+2.5*uRough));
  float reach=dot(spread,spread);
  float glint=max(1.0+3.0*dot(slope,toPointer),0.0);
  float glare=(exp(-reach*1.6)+exp(-reach*0.35)*0.15)*glint*uGlare*(1.0+0.8*(grain-0.5)*brush);
  float highlight=(softbox(q,sigma)*uShine+glare)*mix(0.4,1.0,uMetal);
  vec3 dark=vec3(0.005,0.005,0.006)+uTint*(scene*0.05*uMetal+highlight*0.36);
  vec3 color=dark;
  color=min(color,0.7)+0.3*(1.0-exp(-max(color-0.7,0.0)/0.3));
  color=pow(clamp(color,0.0,1.0),vec3(1.0/2.2));
  color+=(hash(gl_FragCoord.xy)-0.5)/255.0;
  color=clamp(color,0.0,1.0);
  fragColor=vec4(color*coverage,coverage);
}`;

  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const compile=(gl,t,src)=>{const s=gl.createShader(t);if(!s)return null;gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}return s;};

  const root=document.getElementById("root");
  const body=document.getElementById("body");
  const canvas=document.getElementById("canvas");
  const gl=canvas.getContext("webgl2",{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:"default"});
  if(!gl){root.style.background="#1d1c22";return;}

  const vs=compile(gl,gl.VERTEX_SHADER,VERTEX),fs=compile(gl,gl.FRAGMENT_SHADER,PLATE);
  const prog=gl.createProgram();
  gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.bindAttribLocation(prog,0,"aPosition");gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));return;}
  const u={};
  const n=gl.getProgramParameter(prog,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const info=gl.getActiveUniform(prog,i);if(info)u[info.name]=gl.getUniformLocation(prog,info.name);}
  const vao=gl.createVertexArray(),buf=gl.createBuffer();
  gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);

  const S={tint:[1,1,1],rough:0.3,metal:1,blur:6,warp:0.6,warpScale:1,shine:1,bevel:3,glare:0.5,tilt:12,radius:24};
  const size={w:1,h:1,scale:1};
  const x={p:0,v:0,target:0},y={p:0,v:0,target:0},light={p:0,target:0};
  const pointer={x:0,y:0};
  let raf=0,last=0,visible=true,presence=1,presenceStart=0,slowUntil=0,touchId=null;

  function write(){
    const a=S.tilt;
    root.style.setProperty("--rc-rotate-x",(y.p*a).toFixed(3)+"deg");
    root.style.setProperty("--rc-rotate-y",(-x.p*a).toFixed(3)+"deg");
    const eased=1-Math.pow(1-presence,3);
    root.style.setProperty("--rc-presence",eased.toFixed(4));
    root.style.setProperty("--rc-lift",((1-eased)*14).toFixed(2)+"px");
  }
  function resize(){
    size.w=body.offsetWidth;size.h=body.offsetHeight;size.scale=Math.min(window.devicePixelRatio||1,2);
    const w=Math.max(1,Math.round(size.w*size.scale)),h=Math.max(1,Math.round(size.h*size.scale));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    wake();
  }
  function draw(){
    const cx=Math.cos(y.p*S.tilt*Math.PI/180),sx=Math.sin(y.p*S.tilt*Math.PI/180);
    const cy=Math.cos(-x.p*S.tilt*Math.PI/180),sy=Math.sin(-x.p*S.tilt*Math.PI/180);
    const rot=new Float32Array([cy,sx*sy,-cx*sy,0,cx,sx,sy,-sx*cy,cx*cy]);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.uniform2f(u.uSize,size.w,size.h);
    gl.uniform1f(u.uRadius,S.radius);
    gl.uniform1f(u.uScale,canvas.width/Math.max(1,size.w));
    gl.uniformMatrix3fv(u.uRotate,false,rot);
    gl.uniform3fv(u.uTint,S.tint);
    gl.uniform1f(u.uRough,S.rough);
    gl.uniform1f(u.uMetal,S.metal);
    gl.uniform1f(u.uBlur,S.blur);
    gl.uniform1f(u.uWarp,S.warp);
    gl.uniform1f(u.uWarpScale,S.warpScale);
    gl.uniform1f(u.uShine,S.shine);
    gl.uniform1f(u.uBevel,S.bevel);
    gl.uniform1f(u.uGlare,S.glare*light.p);
    gl.uniform2f(u.uPointer,pointer.x,pointer.y);
    gl.bindVertexArray(vao);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindVertexArray(null);
  }
  function frame(now){
    raf=0;
    const dt=Math.min(0.05,(now-last)/1000||0);last=now;
    const slow=now<slowUntil;
    const stiffness=slow?24:120,damping=slow?9:16;
    const steps=Math.max(1,Math.ceil(dt/(1/120))),h=dt/steps;
    for(let i=0;i<steps;i++)for(const a of [x,y]){a.v+=(stiffness*(a.target-a.p)-damping*a.v)*h;a.p+=a.v*h;}
    const tau=light.target>light.p?0.18:slow?0.9:0.45;
    light.p+=(light.target-light.p)*(1-Math.exp(-dt/tau));
    if(presence<1)presence=clamp((now-presenceStart)/650,0,1);
    const moving=Math.abs(x.target-x.p)>0.0005||Math.abs(y.target-y.p)>0.0005||Math.abs(x.v)>0.0005||Math.abs(y.v)>0.0005||Math.abs(light.target-light.p)>0.002||presence<1;
    if(!moving){x.p=x.target;y.p=y.target;x.v=0;y.v=0;light.p=light.target;}
    write();draw();
    if((moving||light.p>0.01)&&visible)raf=requestAnimationFrame(frame);
  }
  function wake(){if(raf||!visible)return;last=performance.now();raf=requestAnimationFrame(frame);}
  function aim(nx,ny,on){x.target=clamp(nx,-1,1);y.target=clamp(ny,-1,1);light.target=on?1:0;slowUntil=0;wake();}
  function aimAt(e){
    const r=root.getBoundingClientRect();if(!r.width||!r.height)return;
    const nx=((e.clientX-r.left)/r.width)*2-1;
    const ny=((e.clientY-r.top)/r.height)*2-1;
    pointer.x=nx*size.w*0.5;pointer.y=ny*size.h*0.5;
    aim(nx,ny,true);
  }
  function release(){aim(0,0,false);}
  root.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")aimAt(e);});
  root.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"||e.pointerId===touchId)aimAt(e);});
  root.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")release();});
  root.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;touchId=e.pointerId;aimAt(e);});
  root.addEventListener("pointerup",e=>{if(e.pointerId!==touchId)return;touchId=null;release();});
  root.addEventListener("pointercancel",e=>{if(e.pointerId!==touchId)return;touchId=null;release();});
  new ResizeObserver(resize).observe(body);
  if(typeof IntersectionObserver!=="undefined"){
    new IntersectionObserver(entries=>{visible=entries.some(en=>en.isIntersecting);wake();}).observe(root);
  }
  resize();
  x.p=0.62;y.p=-0.55;light.p=1;
  pointer.x=0.62*size.w*0.5;pointer.y=-0.55*size.h*0.5;
  presence=0;presenceStart=performance.now();slowUntil=performance.now()+1400;
  write();wake();
})();
</script>
</body>
</html>
