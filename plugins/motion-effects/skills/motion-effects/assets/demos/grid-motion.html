<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GridMotion · 动感照片墙</title>
<style>
  /* Derived line-by-line from the component's Tailwind class strings
     (ROOT / PLANE / ROW / TILE / TILE_GRAY / IMG) so computed styles match. */
  .gm-root { position: relative; isolation: isolate; height: 100%; width: 100%; overflow: hidden; }
  .gm-plane { position: absolute; top: 50%; left: 50%; opacity: 0; }
  .gm-row { position: absolute; left: 0; display: flex; gap: var(--gm-gap); will-change: transform; }
  .gm-tile {
    position: relative;
    display: flex;
    height: var(--gm-tile-h);
    width: var(--gm-tile-w);
    flex: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: var(--gm-radius);
    background: var(--gm-tile);
    text-align: center;
    font-size: var(--gm-font);
    line-height: 1.2;
    color: var(--gm-text);
    opacity: calc(1 - var(--gm-dim) * (1 - var(--spot, 0)));
  }
  .gm-tile::after {
    pointer-events: none;
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px var(--gm-border);
    content: '';
  }
  .gm-tile--gray { filter: grayscale(calc(1 - var(--spot, 0))); }
  .gm-tile img {
    pointer-events: none;
    display: block;
    height: 100%;
    width: 100%;
    object-fit: cover;
    user-select: none;
  }
  .gm-tile .gm-pad { padding-left: 1em; padding-right: 1em; }

  /* page chrome */
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    overflow: hidden;
    background: #0d0c11;
    color: #f2f4f8;
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #wall { position: absolute; inset: 0; }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    pointer-events: none;
  }
  .kicker {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(242, 244, 248, 0.66);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
  }
  .overlay h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 56px);
    line-height: 1.3;
    letter-spacing: 0;
    color: #f2f4f8;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
  }
  .overlay p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.7;
    color: rgba(242, 244, 248, 0.72);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
  }
  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    z-index: 2;
    margin: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: rgba(242, 244, 248, 0.55);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wall"></div>
  <div class="overlay" aria-hidden="true">
    <span class="kicker">Grid Motion</span>
    <h1>维链通</h1>
    <p>品牌 CI 中心 · 动感照片墙</p>
  </div>
  <p class="hint">移动指针点亮聚光 · 相邻行反向漂移 · 边缘羽化融入页面</p>
<script>
(() => {
  'use strict';

  /* ---- helpers, ported verbatim from the component ---- */
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const wrap = (value, total) => ((value % total) + total) % total;
  const smoothstep = (edge0, edge1, value) => {
    const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  };

  const feather = (side, zone) => {
    const stops = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const alpha = t * t * t * (t * (t * 6 - 15) + 10);
      stops.push(`rgba(0, 0, 0, ${alpha.toFixed(4)}) ${(t * zone).toFixed(2)}%`);
    }
    const mirrored = stops.map((_, i) => {
      const t = (12 - i) / 12;
      const alpha = t * t * t * (t * (t * 6 - 15) + 10);
      return `rgba(0, 0, 0, ${alpha.toFixed(4)}) ${(100 - t * zone).toFixed(2)}%`;
    });
    return `linear-gradient(${side}, ${stops.join(', ')}, ${mirrored.join(', ')})`;
  };

  const THEMES = {
    dark: { tile: '#1b1922', text: 'rgba(255, 255, 255, 0.78)', border: 'rgba(255, 255, 255, 0.07)' },
    light: { tile: '#f4f4f5', text: '#3f3f46', border: 'rgba(24, 24, 27, 0.08)' }
  };
  const DIRECTIONS = ['alternate', 'left', 'right'];
  const IMAGE = /^(https?:\/\/|\/\/|\/|\.\.?\/|data:image\/|blob:)|\.(avif|gif|jpe?g|png|svg|webp)(\?.*)?$/i;
  const INERTIA = [0.42, 0.32, 0.26, 0.22];
  const PACE = [1, 0.86, 1.12, 0.94];

  /* ---- demo data: photos reuse local assets; text tiles fill the wall ---- */
  const ITEMS = [
    'assets/sunset.jpg',
    '维链通',
    'assets/landscape.jpg',
    '品牌 CI 中心',
    'assets/city-poster.jpg',
    { src: 'assets/logo.png', alt: '维链通 Logo' },
    'GRID MOTION'
  ];

  const SETTINGS = {
    rows: 4,
    aspectRatio: 1.33,
    gap: 16,
    radius: 14,
    angle: -12,
    tilt: 0,
    speed: 24,
    direction: 'alternate',
    parallax: 0.5,
    spotlight: 0.6,
    dim: 0.35,
    grayscale: false,
    fade: 0.5,
    theme: 'dark'
  };

  const toTile = item => {
    if (item === null || item === undefined || item === false) return { kind: 'empty' };
    if (typeof item === 'object' && 'src' in item && typeof item.src === 'string') {
      return { kind: 'image', src: item.src, alt: item.alt ?? '' };
    }
    const text = String(item).trim();
    return IMAGE.test(text) ? { kind: 'image', src: text, alt: '' } : { kind: 'text', text };
  };

  const tiles = ITEMS.map(toTile);

  const s = {
    rows: clamp(Math.round(SETTINGS.rows), 1, 12),
    aspect: clamp(SETTINGS.aspectRatio, 0.3, 4),
    gap: Math.max(0, SETTINGS.gap),
    angle: SETTINGS.angle,
    tilt: clamp(SETTINGS.tilt, 0, 75),
    speed: SETTINGS.speed,
    direction: DIRECTIONS.includes(SETTINGS.direction) ? SETTINGS.direction : 'alternate',
    parallax: clamp(SETTINGS.parallax, 0, 1),
    spotlight: clamp(SETTINGS.spotlight, 0, 1),
    dim: clamp(SETTINGS.dim, 0, 1),
    fade: clamp(SETTINGS.fade, 0, 1)
  };

  const root = document.getElementById('wall');
  const palette = THEMES[s.theme] ?? THEMES.dark;
  root.style.setProperty('--gm-tile', palette.tile);
  root.style.setProperty('--gm-text', palette.text);
  root.style.setProperty('--gm-border', palette.border);
  root.style.setProperty('--gm-radius', Math.max(0, SETTINGS.radius) + 'px');
  root.style.setProperty('--gm-dim', String(s.dim));
  if (s.fade > 0) {
    const mask = `${feather('to right', s.fade * 34)}, ${feather('to bottom', s.fade * 44)}`;
    root.style.maskImage = mask;
    root.style.webkitMaskImage = mask;
    root.style.maskComposite = 'intersect';
    root.style.webkitMaskComposite = 'source-in';
  }

  const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
  const motion = { offsets: [], shifts: [], intro: 0, pointer: { x: 0, y: 0, active: false } };
  let layout = null;
  let layoutKey = '';
  let plane = null;
  let rowEls = [];
  let tileEls = [];
  let spots = [];
  let written = [];

  const computeLayout = () => {
    const width = Math.round(root.clientWidth);
    const height = Math.round(root.clientHeight);
    if (!width || !height) return null;
    const turn = (s.angle * Math.PI) / 180;
    const lean = (s.tilt * Math.PI) / 180;
    const cos = Math.abs(Math.cos(turn));
    const sin = Math.abs(Math.sin(turn));
    const planeHeight = ((width * sin + height * cos) / Math.max(0.3, Math.cos(lean))) * 1.12;
    const planeWidth = (width * cos + height * sin) * (1 + Math.sin(lean) * 0.9) * 1.12;
    const tileHeight = Math.max(16, (planeHeight - s.gap * (s.rows - 1)) / s.rows);
    const tileWidth = tileHeight * s.aspect;
    const step = tileWidth + s.gap;
    const perRow = Math.ceil(planeWidth / step) + 1;
    const period = perRow * step;
    return {
      planeWidth,
      planeHeight,
      tileWidth,
      tileHeight,
      step,
      perRow,
      period,
      copies: Math.ceil(planeWidth / period) + 2,
      top: (planeHeight - s.rows * tileHeight - (s.rows - 1) * s.gap) / 2,
      perspective: Math.max(width, height) * 1.5
    };
  };

  const build = () => {
    if (plane) plane.remove();
    plane = document.createElement('div');
    plane.className = 'gm-plane';
    plane.setAttribute('aria-hidden', 'true');
    plane.style.width = layout.planeWidth + 'px';
    plane.style.height = layout.planeHeight + 'px';
    plane.style.transform = `translate(-50%, -50%) rotateX(${s.tilt}deg) rotateZ(${s.angle}deg)`;
    plane.style.setProperty('--gm-gap', `${s.gap}px`);
    plane.style.setProperty('--gm-tile-w', `${layout.tileWidth}px`);
    plane.style.setProperty('--gm-tile-h', `${layout.tileHeight}px`);
    plane.style.setProperty('--gm-font', `${clamp(layout.tileHeight * 0.12, 12, 32)}px`);
    rowEls = [];
    tileEls = [];
    spots = [];
    written = [];
    for (let r = 0; r < s.rows; r++) {
      const row = document.createElement('div');
      row.className = 'gm-row';
      row.style.top = layout.top + r * (layout.tileHeight + s.gap) + 'px';
      const list = [];
      for (let k = 0; k < layout.copies * layout.perRow; k++) {
        const tile = tiles.length ? tiles[(r * layout.perRow + (k % layout.perRow)) % tiles.length] : { kind: 'empty' };
        const el = document.createElement('div');
        el.className = 'gm-tile' + (SETTINGS.grayscale ? ' gm-tile--gray' : '');
        if (tile.kind === 'image') {
          const img = document.createElement('img');
          img.src = tile.src;
          img.alt = tile.alt || '';
          img.draggable = false;
          img.decoding = 'async';
          el.appendChild(img);
        } else if (tile.kind === 'text') {
          const span = document.createElement('span');
          span.className = 'gm-pad';
          span.textContent = tile.text;
          el.appendChild(span);
        }
        row.appendChild(el);
        list.push(el);
      }
      plane.appendChild(row);
      rowEls.push(row);
      tileEls.push(list);
      spots.push(new Float32Array(list.length));
      written.push(new Float32Array(list.length));
    }
    root.appendChild(plane);
    if (motion.intro >= 1) plane.style.opacity = '1';
  };

  /* ---- frame loop, ported verbatim from the component ---- */
  let raf = 0;
  let last = performance.now();
  let visible = true;
  let alive = true;

  const frame = now => {
    raf = 0;
    if (!alive) return;
    if (!layout) {
      if (visible) raf = requestAnimationFrame(frame);
      return;
    }
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;

    if (motion.intro < 1) {
      motion.intro = Math.min(1, motion.intro + dt / 0.9);
      plane.style.opacity = String(1 - (1 - motion.intro) ** 3);
    }

    const rect = root.getBoundingClientRect();
    const scale = rect.width ? root.clientWidth / rect.width : 1;
    const halfWidth = root.clientWidth / 2 || 1;
    const halfHeight = root.clientHeight / 2 || 1;
    const px = (motion.pointer.x - rect.left) * scale - halfWidth;
    const py = (motion.pointer.y - rect.top) * scale - halfHeight;
    const inside = motion.pointer.active && Math.abs(px) <= halfWidth && Math.abs(py) <= halfHeight;
    const lean = (s.tilt * Math.PI) / 180;
    const turn = (s.angle * Math.PI) / 180;
    const depth = layout.perspective;
    let flatY = py;
    let flatX = px;
    if (lean > 0.0001) {
      flatY = (py * depth) / (depth * Math.cos(lean) + py * Math.sin(lean));
      flatX = (px * (depth - flatY * Math.sin(lean))) / depth;
    }
    const planeX = flatX * Math.cos(turn) + flatY * Math.sin(turn);
    const planeY = -flatX * Math.sin(turn) + flatY * Math.cos(turn);
    const nudge = motion.pointer.active ? clamp(px / halfWidth, -1, 1) : 0;
    const reach = (0.6 + 2.2 * s.spotlight) * Math.max(layout.tileWidth, layout.tileHeight);
    const settle = 1 - Math.exp(-dt / 0.22);

    rowEls.forEach((row, r) => {
      const drift = s.direction === 'left' ? -1 : s.direction === 'right' ? 1 : r % 2 ? 1 : -1;
      if (motion.offsets[r] === undefined) {
        motion.offsets[r] = r * layout.step * 0.37;
        motion.shifts[r] = 0;
      }
      if (!reduce) motion.offsets[r] += s.speed * drift * PACE[r % PACE.length] * dt;
      const target = reduce ? 0 : s.parallax * layout.tileWidth * 1.2 * nudge * (r % 2 ? -1 : 1);
      motion.shifts[r] += (target - motion.shifts[r]) * (1 - Math.exp(-dt / INERTIA[r % INERTIA.length]));
      const x = -layout.period + wrap(motion.offsets[r] + motion.shifts[r], layout.period);
      row.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;

      const rowY = layout.top + r * (layout.tileHeight + s.gap) + layout.tileHeight / 2 - layout.planeHeight / 2;
      const left = x - layout.planeWidth / 2 + layout.tileWidth / 2;
      const list = tileEls[r];
      const values = spots[r];
      const marks = written[r];
      for (let k = 0; k < list.length; k++) {
        let wanted = 0;
        if (inside && s.spotlight > 0) {
          const distance = Math.hypot(left + k * layout.step - planeX, rowY - planeY) / reach;
          wanted = 1 - smoothstep(0.25, 1, distance);
        }
        values[k] += (wanted - values[k]) * settle;
        if (Math.abs(values[k] - marks[k]) > 0.004 || (wanted === 0 && values[k] < 0.004 && marks[k] !== 0)) {
          marks[k] = values[k] < 0.004 ? 0 : values[k];
          list[k].style.setProperty('--spot', marks[k].toFixed(3));
        }
      }
    });

    if (visible) raf = requestAnimationFrame(frame);
  };

  /* ---- wiring ---- */
  const onMove = event => {
    motion.pointer.x = event.clientX;
    motion.pointer.y = event.clientY;
    motion.pointer.active = true;
  };
  const onUp = event => {
    if (event.pointerType === 'touch') motion.pointer.active = false;
  };
  const onLeave = () => {
    motion.pointer.active = false;
  };
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerdown', onMove, { passive: true });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('blur', onLeave);
  document.documentElement.addEventListener('pointerleave', onLeave);

  const visibility = new IntersectionObserver(entries => {
    visible = entries.some(entry => entry.isIntersecting);
    if (visible && !raf) {
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });
  visibility.observe(root);

  const observer = new ResizeObserver(() => {
    const next = computeLayout();
    const key = next
      ? [next.planeWidth, next.planeHeight, next.tileWidth, next.tileHeight, next.perRow, next.copies].join('|')
      : '';
    if (next && key !== layoutKey) {
      layoutKey = key;
      layout = next;
      build();
    }
  });
  observer.observe(root);

  const initial = computeLayout();
  if (initial) {
    layout = initial;
    layoutKey = [initial.planeWidth, initial.planeHeight, initial.tileWidth, initial.tileHeight, initial.perRow, initial.copies].join('|');
    build();
  }
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
