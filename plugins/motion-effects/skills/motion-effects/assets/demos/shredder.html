      items: files,
      renderItem,
      onShred: (file) => {
        const row = fileListEl.querySelector(`li[data-id="${file.id}"]`);
        if (row) row.dataset.gone = '';
        setStatus(`已 shred：${file.name}`);
      },
      onReorder: (next) => {
        files = next.slice();
        renderFileList();
        setStatus('顺序已更新（onReorder）');
      }
    });
  }

  ['feedSpeed', 'bite', 'stripWidth', 'curl', 'theme', 'autoFeed', 'loop', 'loopAfterDelete', 'autoAnimate', 'disabled']
    .forEach(id => el(id).addEventListener('change', build));
  el('reset').addEventListener('click', () => {
    files = initial.map(item => ({ ...item }));
    renderFileList();
    build();
    setStatus('已重置');
  });

  renderFileList();
  build();
})();
</script>
</body>
</html>
