<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Glassy Dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { min-height: 100svh; background: #ab8e76; }
  @font-face {
    font-family: "Manrope Variable";
    src: url("assets/manrope-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }

.gd-app {
  --gd-ink: #25201e;
  --gd-muted: #423731;
  --gd-line: rgb(74 49 33 / 15%);
  --gd-grid: rgb(74 49 33 / 19%);
  --gd-rim: rgb(255 253 246 / 51%);
  --gd-edge-light: rgb(255 254 247 / 84%);
  --gd-edge-shade: rgb(57 40 28 / 19%);
  --gd-gloss: rgb(255 251 242 / 45%);
  --gd-frame: rgb(247 234 219 / 23%);
  --gd-rail: rgb(241 222 206 / 48%);
  --gd-card: rgb(250 242 232 / 46%);
  --gd-card-light: rgb(255 251 245 / 34%);
  --gd-raised: rgb(255 249 243 / 81%);
  --gd-inner: rgb(255 250 245 / 37%);
  --gd-surface: #f6ece2;
  --gd-track: rgb(81 49 32 / 14%);
  --gd-primary: #261e1b;
  --gd-primary-ink: #fffaf5;
  --gd-pick: #fff9f3;
  --gd-pick-ink: #241b17;
  --gd-coral: #a43c27;
  --gd-teal: #09644f;
  --gd-ochre: #996300;
  --gd-graph-ink: #40332d;
  --gd-focus: #194b48;
  --gd-dark-shadow: 35 21 14;
  inline-size: 100%;
  min-inline-size: 0;
  flex: 1 1 100%;
  position: relative;
  isolation: isolate;
  min-block-size: 100svh;
  background: #ab8e76;
  color: var(--gd-ink);
  color-scheme: light;
  font-family: "Manrope Variable", Manrope, system-ui, sans-serif;
  font-size: 13px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}
.gd-app[data-theme="dark"] {
  --gd-ink: #fff6e9;
  --gd-muted: #e5d5c7;
  --gd-line: rgb(243 221 198 / 19%);
  --gd-grid: rgb(243 221 198 / 19%);
  --gd-rim: rgb(255 236 212 / 31%);
  --gd-edge-light: rgb(255 242 225 / 49%);
  --gd-edge-shade: rgb(11 6 5 / 30%);
  --gd-gloss: rgb(255 237 213 / 13%);
  --gd-frame: rgb(42 31 29 / 52%);
  --gd-rail: rgb(45 32 30 / 59%);
  --gd-card: rgb(47 36 34 / 53%);
  --gd-card-light: rgb(106 88 81 / 30%);
  --gd-raised: rgb(80 67 61 / 82%);
  --gd-inner: rgb(78 61 56 / 49%);
  --gd-surface: #3b302c;
  --gd-track: rgb(245 226 212 / 16%);
  --gd-primary: #f3ddca;
  --gd-primary-ink: #231a16;
  --gd-pick: #f9eee0;
  --gd-pick-ink: #241b17;
  --gd-coral: #ff9177;
  --gd-teal: #75dac0;
  --gd-ochre: #f1be58;
  --gd-graph-ink: #e7d9cd;
  --gd-focus: #f9bf9b;
  --gd-dark-shadow: 10 4 3;
  background: #40322b;
  color-scheme: dark;
}

.gd-app *, .gd-app *::before, .gd-app *::after { box-sizing: border-box; }
.gd-app :where(button, input, select) { color: inherit; font: inherit; }
.gd-app :where(button, a, input, select):focus-visible { outline: 2px solid var(--gd-focus); outline-offset: 3px; }
.gd-app a { color: inherit; text-decoration: none; }
.gd-app button { cursor: pointer; }
.gd-app :where(h1, h2, h3, p, figure) { margin: 0; }
.gd-app svg { flex: none; }
.gd-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.gd-background, .gd-app::before {
  position: fixed;
  z-index: -2;
  inset: 0;
  inline-size: 100%;
  block-size: 100%;
  pointer-events: none;
}
.gd-background {
  object-fit: cover;
  object-position: center 60%;
  filter: sepia(.22) saturate(.78) brightness(.86);
}
.gd-app::before {
  content: "";
  z-index: -1;
  background: linear-gradient(116deg, rgb(73 48 37 / 35%), transparent 43%, rgb(162 101 63 / 24%) 76%, transparent 100%),
    linear-gradient(0deg, rgb(53 33 25 / 34%), transparent 58%);
}
.gd-app[data-theme="dark"] .gd-background { filter: sepia(.15) saturate(.75) brightness(.61); }
.gd-surround {
  inline-size: min(calc(100% - 100px), 1380px);
  margin-inline: auto;
  padding-block: 24px 8px;
}
.gd-top, .gd-dock {
  border: 1px solid var(--gd-rim);
  background: linear-gradient(165deg, var(--gd-gloss), transparent 32% 73%, var(--gd-gloss)), var(--gd-rail);
  box-shadow: inset 1px 1px 1px var(--gd-edge-light), inset -1px -1px 1px var(--gd-edge-shade),
    inset 0 -2px 5px var(--gd-gloss), 0 7px 20px rgb(var(--gd-dark-shadow) / 17%);
  backdrop-filter: blur(15px) saturate(1.35);
  -webkit-backdrop-filter: blur(15px) saturate(1.35);
}
.gd-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 400px) minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-block-size: 60px;
  border-radius: 999px;
  padding: 6px 9px 6px 13px;
}
.gd-brand { display: flex; align-items: center; gap: 10px; min-inline-size: 0; padding-inline-start: 3px; }
.gd-logo {
  inline-size: 35px; block-size: 35px; display: grid; place-items: center;
  border-radius: 50%; background: var(--gd-pick); color: var(--gd-pick-ink);
  box-shadow: inset 0 0 0 1px var(--gd-gloss), 0 2px 7px rgb(var(--gd-dark-shadow) / 12%);
}
.gd-logo svg { width: 22px; height: 22px; }
.gd-brand strong { display: block; font-size: 12px; letter-spacing: .17em; line-height: 1.1; font-weight: 850; }
.gd-brand small { display: block; margin-block-start: 3px; font-size: 10px; color: var(--gd-muted); }
.gd-ask {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-block-size: 43px;
  max-inline-size: 100%;
  border: 1px solid var(--gd-line);
  border-radius: 999px;
  background: var(--gd-inner);
  box-shadow: inset 0 1px 0 var(--gd-gloss);
  padding: 4px 13px 4px 9px;
  text-align: start;
}
.gd-ask:hover, .gd-icon-button:hover { background: var(--gd-raised); }
.gd-orb {
  flex: none;
  inline-size: 25px;
  block-size: 25px;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 32% 24%, #faf7fe 5%, #72ecf1 25%, transparent 58%),
    radial-gradient(ellipse at 67% 54%, #e1b7f9, #815add 55%, #353467 79%);
  box-shadow: inset 0 0 0 .75px rgb(246 245 255 / 75%), inset 0 -2px 5px #604db4, 0 0 0 3px rgb(91 70 115 / 13%), 0 2px 8px rgb(71 46 113 / 35%);
}
.gd-prompt {
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 12px; font-weight: 750;
  animation: gd-prompt-in .74s steps(28, end) both;
}
@keyframes gd-prompt-in { from { clip-path: inset(0 100% 0 0); } }
.gd-ask-search { margin-inline-start: auto; width: 15px; height: 15px; color: var(--gd-muted); }
.gd-top-actions { display: flex; justify-content: flex-end; gap: 6px; }
.gd-icon-button {
  position: relative; min-inline-size: 44px; min-block-size: 44px; display: inline-grid; place-items: center;
  border-radius: 999px; border: 1px solid var(--gd-line); padding: 0; background: var(--gd-inner);
}
.gd-icon-button svg { width: 17px; height: 17px; stroke-width: 1.75; }
.gd-notices { background: var(--gd-raised); }
.gd-notices i {
  position: absolute; block-size: 6px; inline-size: 6px; inset: 9px 9px auto auto; border-radius: 50%;
  background: var(--gd-coral); box-shadow: 0 0 0 2px var(--gd-surface);
}

.gd-stage-wrap { position: relative; margin-block: 11px 0; }
.gd-stage {
  color: var(--gd-ink);
  border: 1px solid var(--gd-rim);
  border-radius: 34px;
  background:
    linear-gradient(148deg, var(--gd-gloss), transparent 19% 77%, color-mix(in srgb, var(--gd-gloss) 48%, transparent)),
    var(--gd-frame);
  box-shadow: inset 1px 1px 1px var(--gd-edge-light), inset -1px -1px 1px var(--gd-edge-shade),
    inset 0 0 7px var(--gd-gloss),
    0 1px 3px rgb(var(--gd-dark-shadow) / 17%), 0 22px 72px rgb(var(--gd-dark-shadow) / 22%);
  backdrop-filter: blur(var(--gd-panel-frost, 12px)) saturate(1.24);
  -webkit-backdrop-filter: blur(var(--gd-panel-frost, 12px)) saturate(1.24);
}
.gd-stage-scroll {
  block-size: max(605px, min(865px, calc(100svh - 165px)));
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--gd-line) transparent;
  border-radius: inherit;
  padding: clamp(19px, 2.15vw, 35px) clamp(25px, 3.2vw, 49px) 41px;
}
.gd-view-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 22px;
  margin-block-end: 19px;
}
.gd-view-head h1 {
  font-size: clamp(29px, 3.35vw, 49px);
  font-weight: 760;
  line-height: 1.03;
  letter-spacing: -.062em;
}
.gd-view-head p { color: var(--gd-muted); font-size: 13px; margin-block-start: 8px; }
.gd-view-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.gd-period {
  display: inline-flex; align-items: center; padding: 3px; border-radius: 999px;
  border: 1px solid var(--gd-rim); background: var(--gd-inner);
  box-shadow: inset 0 1px 0 var(--gd-gloss);
}
.gd-period button {
  min-block-size: 35px; min-inline-size: 56px; border: 0; border-radius: 999px; background: transparent;
  padding: 0 11px; font-size: 11px; font-weight: 750; white-space: nowrap;
}
.gd-period button[aria-pressed="true"] { background: var(--gd-primary); color: var(--gd-primary-ink); }
.gd-period button[aria-pressed="false"]:hover { background: var(--gd-inner); }

.gd-primary, .gd-secondary {
  display: inline-flex; justify-content: center; align-items: center; gap: 7px;
  min-block-size: 40px; padding: 7px 12px;
  font-size: 11.5px; font-weight: 790; line-height: 1.2; border-radius: 999px;
  border: 1px solid transparent;
}
.gd-primary { background: var(--gd-primary); color: var(--gd-primary-ink); }
.gd-secondary { background: var(--gd-raised); border-color: var(--gd-rim); color: var(--gd-ink); }
.gd-primary:hover { filter: brightness(1.17); }
.gd-secondary:hover { background: var(--gd-surface); }
.gd-primary svg, .gd-secondary svg { width: 14px; height: 14px; }
.gd-export { white-space: nowrap; }
.gd-content { min-inline-size: 0; }
.gd-analytics, .gd-command-grid, .gd-command-side, .gd-summary, .gd-metric-grid, .gd-analytics-grid { display: grid; gap: 12px; }
.gd-command-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1.05fr); align-items: stretch; }
.gd-command-side { grid-column: 1; align-content: start; }
.gd-command-grid > .gd-activity { grid-column: 2 / -1; }
.gd-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; padding: 6px; }
.gd-analytics-grid { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.gd-metric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.gd-panel, .gd-metric, .gd-summary {
  min-inline-size: 0;
  border: 1px solid var(--gd-rim);
  border-radius: 20px;
  background: linear-gradient(144deg, var(--gd-card-light), transparent 66%), var(--gd-card);
  box-shadow: inset 0 1px 1px var(--gd-edge-light), inset 0 -1px 1px var(--gd-edge-shade), 0 6px 18px rgb(var(--gd-dark-shadow) / 9%);
}
.gd-summary { border-radius: 20px; background: var(--gd-inner); }
.gd-summary .gd-metric { border-radius: 15px; }
.gd-panel { padding: 15px 16px; }
.gd-panel-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;
  gap: 7px 12px; margin-block-end: 12px;
}
.gd-panel-head h2 { font-size: 14px; font-weight: 810; letter-spacing: -.024em; }
.gd-panel-head p { font-size: 11px; color: var(--gd-muted); margin-block-start: 3px; }
.gd-metric { display: flex; flex-direction: column; justify-content: space-between; min-block-size: 112px; padding: 11px 12px; }
.gd-metric[data-tone="teal"] {
  --gd-coral: #ffc8b8;
  --gd-teal: #b8f1dd;
  --gd-muted: #e4f5ef;
  color: #fff;
  border-color: rgb(196 248 231 / 55%);
  background: radial-gradient(ellipse at 5% -20%, #3a9381, transparent 68%), linear-gradient(145deg, #1e7461, #08443a);
  box-shadow: inset 0 1px 2px rgb(214 252 240 / 45%), 0 6px 14px rgb(19 78 64 / 17%);
}
.gd-metric-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-inline-size: 0; font-size: 11px; font-weight: 740; }
.gd-metric-icon, .gd-list-icon {
  display: grid; place-items: center; flex: none; color: inherit;
  inline-size: 28px; block-size: 28px; border-radius: 10px;
  background: var(--gd-inner); box-shadow: inset 0 1px 0 var(--gd-gloss);
}
.gd-metric-icon svg, .gd-list-icon svg { width: 14px; height: 14px; }
.gd-metric[data-tone="teal"] .gd-metric-icon { background: rgb(235 255 247 / 16%); }
.gd-metric-value { display: block; font-size: clamp(22px, 2.35vw, 35px); line-height: 1.05; margin-block: 3px 7px; letter-spacing: -.052em; font-weight: 815; }
.gd-summary .gd-metric-value { font-size: clamp(20px, 2vw, 31px); }
.gd-metric-caption, .gd-balance-change { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--gd-muted); font-size: 10px; font-weight: 680; }
.gd-delta {
  display: inline-flex; align-items: center; gap: 2px; color: var(--gd-teal); font-weight: 850;
  border-radius: 6px; padding: 2px 4px;
  background: color-mix(in srgb, var(--gd-teal) 12%, transparent);
}
.gd-delta[data-attention="true"] { color: var(--gd-coral); background: color-mix(in srgb, var(--gd-coral) 11%, transparent); }
.gd-delta svg { width: 11px; height: 11px; stroke-width: 2.4; }

.gd-balance .gd-panel-head { align-items: center; margin-block-end: 9px; }
.gd-unit { border-radius: 6px; padding: 4px 6px; background: var(--gd-raised); font-size: 10px; font-weight: 810; }
.gd-balance-number { font-size: clamp(28px, 3.85vw, 57px); font-weight: 820; letter-spacing: -.077em; line-height: 1.02; }
.gd-balance-change { margin-block-start: 7px; }
.gd-balance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-block: 13px 12px; }
.gd-streams { display: flex; border-radius: 12px; background: var(--gd-inner); padding: 8px 2px; }
.gd-streams div { flex: 1; min-inline-size: 0; padding: 0 7px; }
.gd-streams div + div { border-inline-start: 1px solid var(--gd-line); }
.gd-streams span, .gd-streams strong { display: block; }
.gd-streams span { font-size: 9px; color: var(--gd-muted); }
.gd-streams strong { font-size: 11px; font-weight: 810; margin-block-start: 4px; }
.gd-capacity .gd-panel-head, .gd-approvals .gd-panel-head { margin-block-end: 10px; }
.gd-capacity-track, .gd-mix-track { display: block; height: 7px; border-radius: 999px; overflow: hidden; background: var(--gd-track); }
.gd-capacity-track .gd-fill { display: block; block-size: 100%; border-radius: inherit; background: var(--gd-teal); transform-origin: left center; }
.gd-capacity-label { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; color: var(--gd-muted); font-size: 10px; margin-top: 8px; }
.gd-capacity-label strong { color: var(--gd-ink); }
.gd-approval-content { display: flex; align-items: center; gap: 9px; min-inline-size: 0; }
.gd-approval-content .gd-list-icon { inline-size: 37px; block-size: 37px; color: var(--gd-teal); background: color-mix(in srgb, var(--gd-teal) 12%, var(--gd-inner)); }
.gd-approval-content div { flex: 1; min-inline-size: 0; }
.gd-approval-content strong, .gd-approval-content small { display: block; }
.gd-approval-content strong { font-size: 12px; font-weight: 810; }
.gd-approval-content small { margin-top: 4px; font-size: 10px; color: var(--gd-muted); }
.gd-statement .gd-panel-head { margin-block-end: 8px; }

.gd-table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; max-inline-size: 100%; }
.gd-search, .gd-filter {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--gd-line); border-radius: 10px;
  background: var(--gd-inner); min-block-size: 35px; padding: 0 8px;
}
.gd-search svg, .gd-filter svg { width: 13px; height: 13px; color: var(--gd-muted); }
.gd-search input { width: 105px; flex: 1; min-inline-size: 0; border: 0; background: transparent; min-block-size: 33px; }
.gd-search input::placeholder { color: var(--gd-muted); opacity: 1; }
.gd-search input, .gd-filter select { font-size: 11px; }
.gd-filter select { border: 0; background: transparent; padding: 5px 0; min-inline-size: 0; }
.gd-filter select option { color: var(--gd-ink); background: var(--gd-surface); }
.gd-search:focus-within, .gd-filter:focus-within { outline: 2px solid var(--gd-focus); }
.gd-app .gd-search input:focus-visible, .gd-app .gd-filter select:focus-visible { outline: none; }
.gd-table-scroll { max-inline-size: 100%; overflow: auto; scrollbar-width: thin; }
.gd-table-scroll table { inline-size: 100%; border-spacing: 0; text-align: start; }
.gd-table-scroll th, .gd-table-scroll td { padding: 9px 10px; text-align: start; }
.gd-table-scroll th { background: var(--gd-inner); font-size: 10px; color: var(--gd-muted); font-weight: 800; }
.gd-table-scroll th:first-child { border-radius: 8px 0 0 8px; }
.gd-table-scroll th:last-child { border-radius: 0 8px 8px 0; }
.gd-table-scroll td { white-space: nowrap; font-size: 11px; }
.gd-table-scroll td:first-child { font-weight: 750; }
.gd-table-scroll tr + tr td { border-top: 1px solid var(--gd-line); }
.gd-status {
  --gd-status-color: var(--gd-graph-ink);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 6px; border-radius: 999px; font-size: 10px; font-weight: 790;
  background: color-mix(in srgb, var(--gd-status-color) 11%, var(--gd-inner));
  color: var(--gd-status-color); white-space: nowrap;
}
.gd-status[data-state="teal"] { --gd-status-color: var(--gd-teal); }
.gd-status[data-state="coral"] { --gd-status-color: var(--gd-coral); }
.gd-status i { inline-size: 5px; block-size: 5px; border-radius: 50%; background: currentColor; }
.gd-empty { padding: 12px 3px; color: var(--gd-muted); font-size: 12px; }

.gd-app [data-tone="ink"] { --gd-series: var(--gd-graph-ink); }
.gd-app [data-tone="coral"] { --gd-series: var(--gd-coral); }
.gd-app [data-tone="teal"] { --gd-series: var(--gd-teal); }
.gd-app [data-tone="ochre"] { --gd-series: var(--gd-ochre); }
.gd-legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--gd-muted); }
.gd-legend span, .gd-device-list button span:first-child { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 740; }
.gd-legend i, .gd-device-list button span:first-child i { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--gd-series); }
.gd-stack-meta { display: flex; justify-content: space-between; align-items: center; height: 20px; gap: 4px; }
.gd-chart-readout { font-size: 10px; font-weight: 830; white-space: nowrap; }
.gd-stack-plot { display: grid; grid-template-columns: repeat(var(--gd-series-count), minmax(0, 1fr)); gap: 4px; block-size: 194px; margin-top: 5px; }
.gd-command-chart .gd-stack-plot { block-size: 141px; }
.gd-stack-column { display: flex; flex-direction: column; align-items: center; min-inline-size: 0; border: 0; border-radius: 8px; background: transparent; padding: 3px 0 0; }
.gd-stack-column:is(:focus-visible, :hover, [aria-pressed="true"]) { background: var(--gd-inner); }
.gd-stack-track { display: flex; justify-content: center; align-items: end; flex: 1; inline-size: 100%; border-bottom: 1px solid var(--gd-line); }
.gd-stack-bar {
  display: flex; flex-direction: column; transform-origin: center bottom;
  inline-size: min(65%, 40px); min-inline-size: 6px; border-radius: 6px 6px 3px 3px; overflow: hidden;
}
.gd-stack-bar i { display: block; flex-basis: 0; background: var(--gd-series); min-block-size: 2px; }
.gd-stack-bar i:first-child { background: repeating-linear-gradient(138deg, var(--gd-series) 0 4px, color-mix(in srgb, var(--gd-series) 76%, white) 4px 6px); }
.gd-stack-label { font-size: 9px; color: var(--gd-muted); margin-top: 7px; white-space: nowrap; }
.gd-revenue-main { display: grid; grid-template-columns: 38px minmax(0, 1fr); }
.gd-chart-y { display: flex; flex-direction: column; justify-content: space-between; padding-block: 0; font-size: 10px; color: var(--gd-muted); }
.gd-line-plot { position: relative; min-inline-size: 0; block-size: 208px; }
.gd-line-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.gd-grid-line { stroke: var(--gd-grid); stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.gd-chart-path { fill: none; stroke: var(--gd-series); stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.gd-line-cursor { stroke: var(--gd-muted); stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; }
.gd-chart-zones { position: absolute; inset: 0; display: flex; align-items: stretch; }

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = value => String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const PHOTO = "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600&q=80&fit=crop";
const nf = new Intl.NumberFormat("en-US");
const currency = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format;
const compact = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 }).format;
const fmt = {
  number: value => nf.format(Math.round(value)),
  usd: currency,
  compact,
  percent: value => value.toFixed(1) + "%",
};
const icon = (name, cls = "") => `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ""}></i>`;
const logo = '<svg viewBox="0 0 28 28" fill="none"><path d="m5 22 7.4-16h3.2L23 22h-4l-5-11.4L9 22H5Z" fill="currentColor"/><path d="M10 18h8l1.4 3h-10.8l1.4-3Z" fill="currentColor"/></svg>';
const routeOrder = views.map(view => view.id);
const validView = id => routeOrder.includes(id) ? id : "command";

const state = {
  view: validView(location.hash.slice(1)),
  period: "30 days",
  theme: (() => {
    const html = document.documentElement;
    if (html.classList.contains("dark") || html.dataset.theme === "dark") return "dark";

    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  })(),
  frost: 12,
  workspace: "ATLAS",
  work: initialWork.map(item => ({ ...item })),
  readNotices: false,

matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", event => { state.reduced = event.matches; });

/* ---------- small render primitives ---------- */
function count(value, format = "number") {
  const text = fmt[format](value);
  return `<span data-gd-count="${value}" data-format="${format}" aria-hidden="true">${text}</span><span class="gd-sr">${text}</span>`;
}
function panel(title, subtitle, action, className, body) {
  return `<section class="gd-panel ${className}" data-gd-enter>

}
function metric({ title, glyph, value, format, change, detail, tone }) {
  const attention = tone === "coral";
  const arrow = change && change.startsWith("−") ? "arrow-down-right" : "arrow-up-right";
  return `<article class="gd-metric" data-tone="${tone || ""}" data-gd-enter>
    <div class="gd-metric-head"><span>${esc(title)}</span><span class="gd-metric-icon" aria-hidden="true">${icon(glyph)}</span></div>
    <strong class="gd-metric-value">${count(value, format)}</strong>
    <div class="gd-metric-caption">
      ${change ? `<span class="gd-delta" data-attention="${attention}">${icon(arrow)}${esc(change)}</span>` : ""}
      <span>${esc(detail || "vs prior period")}</span>
    </div>
  </article>`;
}
function badge(status) {
  const color = status === "Complete" || status === "Running" ? "teal"
    : status === "Needs review" || status === "Exceptions" ? "coral" : "ink";
  return `<span class="gd-status" data-state="${color}"><i aria-hidden="true"></i>${esc(status)}</span>`;
}
function legend(entries) {
  return `<div class="gd-legend">${entries.map(({ label, tone }) => `<span><i data-tone="${tone}" aria-hidden="true"></i>${esc(label)}</span>`).join("")}</div>`;
}
function curve(points) {
  return points.reduce((path, [x, y], index) => {
    if (index === 0) return `M ${x} ${y}`;
    const [px, py] = points[index - 1];
    const mid = (x + px) / 2;
    return `${path} C ${mid} ${py}, ${mid} ${y}, ${x} ${y}`;
  }, "");
}

/* ---------- charts ---------- */
function stackChart(items, labels, tones, formatFn, title) {
  const max = Math.max(1, ...items.map(item => item.lower + item.upper)) * 1.11;
  const chartIndex = stackCharts.push({ items, format: formatFn }) - 1;
  return `<figure class="gd-stack" data-stack-chart="${chartIndex}" aria-label="${esc(title)}">
    <div class="gd-stack-meta">${legend(labels.map((label, i) => ({ label, tone: tones[i] })))}<span class="gd-chart-readout" data-readout></span></div>
    <div class="gd-stack-plot" style="--gd-series-count:${items.length}">
      ${items.map((item, index) => `<button type="button" class="gd-stack-column" data-stack="${index}" aria-pressed="false"
        aria-label="${esc(item.label)}: ${formatFn(item.lower)} ${esc(labels[0])}, ${formatFn(item.upper)} ${esc(labels[1])}">
        <span class="gd-stack-track" aria-hidden="true"><span class="gd-stack-bar" style="height:${(item.lower + item.upper) / max * 100}%">
          <i data-tone="${tones[1]}" style="flex-grow:${item.upper}"></i>
          <i data-tone="${tones[0]}" style="flex-grow:${item.lower}"></i>
        </span></span>
        <span class="gd-stack-label" aria-hidden="true">${esc(item.label)}</span>
      </button>`).join("")}
    </div>
  </figure>`;
}

function revenueChart(labels, revenue, costs) {
  const plotHeight = 204, width = 600;
  const max = Math.ceil(Math.max(...revenue, ...costs) * 1.14 / 2.5) * 2.5;
  const points = values => values.map((value, index) => [index * width / Math.max(1, values.length - 1), plotHeight - value / max * plotHeight]);
  const rPoints = points(revenue), cPoints = points(costs);
  const line = curve(rPoints);
  const last = (rPoints.length - 1) * width / Math.max(1, rPoints.length - 1);
  const ticks = [max, max * .75, max * .5, max * .25, 0];
  return `<figure class="gd-revenue-chart" aria-label="Revenue and operating costs by date">
    <div class="gd-revenue-main">
      <div class="gd-chart-y" aria-hidden="true">${ticks.map(value => `<span>${value === 0 ? "0" : `$${Number(value.toFixed(1))}k`}</span>`).join("")}</div>
      <div class="gd-line-plot">
        <svg viewBox="0 0 ${width} ${plotHeight}" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="revenue-fill-demo" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0" stop-color="var(--gd-coral)" stop-opacity=".30" />
            <stop offset="1" stop-color="var(--gd-coral)" stop-opacity=".025" />
          </linearGradient></defs>
          ${ticks.map((tick, index) => `<line class="gd-grid-line" x1="0" x2="${width}" y1="${plotHeight * index / 4}" y2="${plotHeight * index / 4}" />`).join("")}
          <g class="gd-line-reveal">
            <path d="${line} L ${last} ${plotHeight} H 0 Z" fill="url(#revenue-fill-demo)" />
            <path class="gd-chart-path" data-tone="coral" d="${line}" />
            <path class="gd-chart-path" data-tone="ink" d="${curve(cPoints)}" />
          </g>
          <g class="gd-line-cursor-group" opacity="0">
            <line class="gd-line-cursor" x1="0" x2="0" y1="0" y2="${plotHeight}" />
            <circle class="gd-cursor-revenue" cx="0" cy="0" r="4" fill="var(--gd-coral)" />
            <circle class="gd-cursor-cost" cx="0" cy="0" r="4" fill="var(--gd-graph-ink)" />
          </g>
        </svg>
        <div class="gd-chart-zones">${labels.map((label, index) => `<button type="button" data-zone="${index}" aria-pressed="false"
          aria-label="${esc(label)}, revenue ${currency(revenue[index] * 1000)}, operating costs ${currency(costs[index] * 1000)}"></button>`).join("")}</div>
        <div class="gd-line-tooltip" data-tooltip hidden>
          <strong data-tip-label></strong><span>Revenue <b data-tip-revenue></b></span><span>Costs <b data-tip-costs></b></span>
        </div>
      </div>
    </div>
    <div class="gd-chart-axis" aria-hidden="true">${labels.map(label => `<span>${esc(label)}</span>`).join("")}</div>
  </figure>`;
}

function analyticsView(stats, type) {
  const trend = type === "trends";
  const costTotal = Math.round(stats.costs.reduce((total, cost) => total + cost, 0) * 1000);
  const margin = (stats.revenue - costTotal) / stats.revenue * 100;
  const metrics = trend ? `
    ${metric({ title: "Revenue", glyph: "circle-dollar-sign", value: stats.revenue, format: "compact", change: stats.revenueChange, tone: "teal" })}
    ${metric({ title: "Operating costs", glyph: "arrow-down-right", value: costTotal, format: "compact", detail: "in this period" })}
    ${metric({ title: "Net revenue", glyph: "box", value: stats.revenue - costTotal, format: "compact", detail: "after operating costs" })}
    ${metric({ title: "Operating margin", glyph: "circle-dollar-sign", value: margin, format: "percent", detail: "of revenue" })}` : `
    ${metric({ title: "Revenue", glyph: "circle-dollar-sign", value: stats.revenue, format: "compact", change: stats.revenueChange, tone: "teal" })}
    ${metric({ title: "Orders", glyph: "shopping-bag", value: stats.orders, change: stats.orderChange })}
    ${metric({ title: "Visitors", glyph: "eye", value: stats.visitors, change: stats.visitorChange })}
    ${metric({ title: "Refunds", glyph: "arrow-down-right", value: stats.refunds, change: stats.refundChange })}`;
  const chart = trend
    ? revenueChart(stats.axis, stats.collected, stats.costs)
    : stackChart(stats.axis.map((label, index) => {
        const sum = stats.collected[index] * 1000;
        const lower = Math.round(sum * stats.desktop[index] / 100);
        return { label, lower, upper: sum - lower };
      }), ["Desktop", "Mobile"], ["ink", "coral"], currency, "Revenue by device and date");
  return `<div class="gd-analytics">
    <div class="gd-metric-grid">${metrics}</div>
    <div class="gd-analytics-grid">
      ${panel(trend ? "Revenue vs operating costs" : "Revenue by device",
        trend ? "Compare revenue and costs across the selected period" : "Desktop and mobile revenue across the selected period",
        trend ? legend([{ label: "Revenue", tone: "coral" }, { label: "Costs", tone: "ink" }]) : "", "", chart)}
      ${panel("Traffic by device", "", "", "gd-device-panel", deviceChart(stats.devices, stats.visitors))}
    </div>
    ${trend ? panel("Reporting snapshot", "", "", "gd-statement", `
      <div class="gd-approval-content"><span class="gd-list-icon">${icon("clock-3")}</span>
        <div><strong>Revenue and operating costs</strong><small>${esc(state.period)} · ${esc(stats.axis[0])} to ${esc(stats.axis.at(-1))}</small></div>

      </div>`) : panel("Recent activity", "", activityToolbar(), "gd-activity", activityBody())}
  </div>`;
}

/* ---------- animations (same GSAP timeline as the React component) ---------- */
function animateContent() {
  const layer = $("#content");
  if (!layer) return;
  const counts = $$("[data-gd-count]", layer);
  if (state.reduced || !window.gsap) {
    counts.forEach(el => { el.textContent = fmt[el.dataset.format](Number(el.dataset.gdCount)); });
    return;
  }
  gsap.set(layer, { clearProps: "opacity,filter" });
  const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
  tl.fromTo(layer, { opacity: .55, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", clearProps: "opacity,filter", duration: .32 }, 0);
  const entering = $$("[data-gd-enter]", layer);
  if (entering.length) tl.from(entering, { y: 18, opacity: 0, stagger: .045, duration: .50, clearProps: "transform,opacity" }, .035);
  const bars = $$(".gd-stack-bar", layer);
  const line = $(".gd-line-reveal", layer);
  const ring = $(".gd-donut-draw", layer);
  const meters = $$(".gd-fill", layer);
  if (bars.length) tl.from(bars, { scaleY: 0, stagger: .034, duration: .46, clearProps: "transform" }, .17);
  if (line) tl.fromTo(line, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: .74, clearProps: "clipPath" }, .14);
  if (ring) tl.fromTo(ring, { attr: { "stroke-dasharray": "0 100" } }, { attr: { "stroke-dasharray": "100 0" }, duration: .76 }, .16);
  if (meters.length) tl.from(meters, { scaleX: 0, duration: .58, stagger: .045, clearProps: "transform" }, .18);
  counts.forEach((el, index) => {
    const target = Number(el.dataset.gdCount);
    const format = fmt[el.dataset.format];
    const counter = { value: 0 };
    tl.to(counter, { value: target, duration: .75, onUpdate: () => { el.textContent = format(counter.value); } }, .09 + index * .02);
  });
}

/* ---------- view-scoped interactions ---------- */
function bindView() {
  $$("[data-activity-query], [data-activity-status]").forEach(el => {
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", refreshActivity);
  });
  $$("[data-lane-filter]").forEach(el => el.addEventListener("change", event => {
    state.laneFilter = event.target.value;
    renderView();
  }));
  $$("[data-work]").forEach(el => el.addEventListener("click", () => {
    const item = state.work.find(work => work.id === el.dataset.work);
    if (item) openWorkDialog(item);
  }));
  $$("[data-stack]").forEach(el => {
    const figure = el.closest(".gd-stack");
    const items = figure ? $$("[data-stack]", figure) : [];
    const setActive = index => {
      items.forEach((node, i) => node.setAttribute("aria-pressed", String(i === index)));
      const readout = $("[data-readout]", figure);
      if (readout) {
        const data = stackData.get(figure);
        const item = data && data[index];
        readout.textContent = item ? `${item.label} · ${data.format(item.lower + item.upper)}` : "";
      }
    };
    el.addEventListener("mouseenter", () => setActive(Number(el.dataset.stack)));
    el.addEventListener("focus", () => setActive(Number(el.dataset.stack)));
    el.addEventListener("click", () => setActive(Number(el.dataset.stack)));
    el.addEventListener("blur", () => setActive(null));
    figure?.addEventListener("mouseleave", () => setActive(null));
  });
  const plot = $(".gd-stack-plot");
  plot?.addEventListener("mouseleave", () => {
    $$("[data-stack]", plot).forEach(node => node.setAttribute("aria-pressed", "false"));
    const readout = $("[data-readout]", plot.parentElement);
    if (readout) readout.textContent = "";
  });
  bindRevenueChart();
  bindDeviceChart();
}

const stackData = new WeakMap();
let stackCharts = [];

function bindRevenueChart() {
  const plot = $(".gd-line-plot");
  if (!plot) return;
  const stats = analytics[state.period];
  const zones = $$("[data-zone]", plot);
  const cursor = $(".gd-line-cursor-group", plot);
  const tooltip = $("[data-tooltip]", plot);
  const plotHeight = 204, width = 600;
  const max = Math.ceil(Math.max(...stats.collected, ...stats.costs) * 1.14 / 2.5) * 2.5;
  const toPoint = (value, index, length) => [index * width / Math.max(1, length - 1), plotHeight - value / max * plotHeight];
  const setActive = index => {
    zones.forEach((zone, i) => zone.setAttribute("aria-pressed", String(i === index)));
    if (index === null) {
      cursor?.setAttribute("opacity", "0");
      if (tooltip) tooltip.hidden = true;
      return;
    }
    const [rx, ry] = toPoint(stats.collected[index], index, stats.collected.length);
    const [cx, cy] = toPoint(stats.costs[index], index, stats.costs.length);
    if (cursor) {
      cursor.setAttribute("opacity", "1");
      const line = $(".gd-line-cursor", cursor);
      line?.setAttribute("x1", rx); line?.setAttribute("x2", rx);
      const r = $(".gd-cursor-revenue", cursor), c = $(".gd-cursor-cost", cursor);
      r?.setAttribute("cx", rx); r?.setAttribute("cy", ry);
      c?.setAttribute("cx", cx); c?.setAttribute("cy", cy);
    }
    if (tooltip) {
      tooltip.hidden = false;
      tooltip.style.setProperty("--gd-tooltip-x", `${index / (stats.axis.length - 1) * 100}%`);
      $("[data-tip-label]", tooltip).textContent = stats.axis[index];
      $("[data-tip-revenue]", tooltip).textContent = currency(stats.collected[index] * 1000);
      $("[data-tip-costs]", tooltip).textContent = currency(stats.costs[index] * 1000);
    }
  };
  zones.forEach(zone => {
    zone.addEventListener("mouseenter", () => setActive(Number(zone.dataset.zone)));
    zone.addEventListener("focus", () => setActive(Number(zone.dataset.zone)));
    zone.addEventListener("click", () => setActive(Number(zone.dataset.zone)));
    zone.addEventListener("blur", () => setActive(null));
  });
  plot.addEventListener("mouseleave", () => setActive(null));
}

function bindDeviceChart() {
  $$("[data-device]").forEach(button => {
    const index = Number(button.dataset.device);
    const apply = () => {
      const chart = button.closest(".gd-device");
      const active = button.getAttribute("aria-pressed") === "true" ? null : index;
      $$("[data-device]", chart).forEach(node => node.setAttribute("aria-pressed", String(Number(node.dataset.device) === active)));
      $$("[data-segment]", chart).forEach(node => node.dataset.muted = String(active !== null && Number(node.dataset.segment) !== active));
      const stats = analytics[state.period];
      const total = $("[data-device-total]", chart);
      const label = $("[data-device-label]", chart);
      if (active === null) {
        if (total) total.innerHTML = count(stats.visitors);
        if (label) label.textContent = "Visitors";
      } else {
        const value = nf.format(Math.round(stats.visitors * stats.devices[active] / 100));
        if (total) total.textContent = value;
        if (label) label.textContent = deviceLabels[active];
      }
    };
    button.addEventListener("click", apply);
  });
}

/* ---------- dialogs ---------- */
function openDialog(title, body) {
  const host = $("#modalHost");
  host.innerHTML = `<dialog class="gd-dialog" id="gdDialog">
    <section class="gd-dialog-inner"><header><h2>${esc(title)}</h2>
      <button type="button" class="gd-icon-button" aria-label="Close dialog" data-action="close-dialog">${icon("x")}</button>
    </header>${body}</section></dialog>`;
  lucide.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.75 } });
  const dialog = $("#gdDialog");
  dialog.addEventListener("close", () => { host.innerHTML = ""; });
  dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
  dialog.showModal();
  dialog.querySelector("input")?.focus();
  return dialog;
}
function openSearchDialog() {
  const body = `<label class="gd-search gd-command-input">${icon("search")}
      <input type="search" data-search-input aria-label="Find a dashboard view" placeholder="Find a view or report" />
    </label><div class="gd-quick-list" data-search-results></div>`;
  const dialog = openDialog(`Search ${state.workspace}`, body);
  const render = () => {
    const terms = ($("[data-search-input]", dialog).value || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
    const results = views.filter(view => terms.every(term => `${view.label} ${view.description} ${view.prompt}`.toLowerCase().includes(term)));
    $("[data-search-results]", dialog).innerHTML = results.map(view => `<button type="button" data-result="${view.id}">
      ${icon(view.icon)}<div><strong>${esc(view.label)}</strong><small>${esc(view.description)}</small></div>${icon("chevron-right")}
    </button>`).join("") || `<p class="gd-empty" role="status">No matching views.</p>`;
    $$("[data-result]", dialog).forEach(button => button.addEventListener("click", () => {
      dialog.close();
      navigate(button.dataset.result);
    }));
  };
  $("[data-search-input]", dialog).addEventListener("input", render);
  render();
}
function openNotificationsDialog() {
  const pending = state.work.filter(item => item.status === "Needs review");
  const body = `<div class="gd-quick-list">${pending.map(item => `<button type="button" data-notice="${item.id}">
    ${icon("bell")}<div><strong>${esc(item.name)}</strong><small>${esc(item.description)}</small></div>${icon("arrow-right")}
  </button>`).join("")}${pending.length === 0 ? `<p class="gd-empty">You’re all caught up.</p>` : ""}</div>`;
  const dialog = openDialog("Notifications", body);
  $$("[data-notice]", dialog).forEach(button => button.addEventListener("click", () => {
    const item = state.work.find(work => work.id === button.dataset.notice);
    dialog.close();
    navigate("operations");
    if (item) openWorkDialog(item);
  }));
}
function openWorkDialog(item) {
  const body = `${badge(item.status)}
    <p class="gd-work-dialog-description">${esc(item.description)}</p>
    <dl class="gd-work-facts">
      <div><dt>System</dt><dd>${esc(item.tool)}</dd></div>
      <div><dt>Owner</dt><dd>${esc(item.owner)}</dd></div>
      <div><dt>Reference</dt><dd>${esc(item.id)}</dd></div>
    </dl>
    ${item.status === "Needs review" ? `<button type="button" class="gd-primary" data-action="review" data-id="${item.id}">Mark reviewed ${icon("command")}</button>` : ""}`;
  const dialog = openDialog(item.name, body);
  const review = $("[data-action='review']", dialog);
  review?.addEventListener("click", () => {
    state.work = state.work.map(work => work.id === item.id ? { ...work, status: "Scheduled" } : work);
    dialog.close();
    if (state.view === "operations") renderView();
    else syncDock();
  });
}

/* ---------- navigation / CSV ---------- */
function saveCsv(filename, rows) {
  const csv = rows.map(row => row.map(cell => `"${String(cell).replaceAll('"', '""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}
function downloadReport() {
  const stats = analytics[state.period];
  saveCsv(`atlas-trends-${state.period.replace(" ", "-")}.csv`, [
    ["Period ending", "Revenue (USD)", "Operating costs (USD)"],
    ...stats.axis.map((label, index) => [label, Math.round(stats.collected[index] * 1000), Math.round(stats.costs[index] * 1000)]),
  ]);
}
function downloadWork() {
  saveCsv("atlas-operations.csv", [
    ["ID", "Workflow", "System", "Owner", "Status", "Time"],
    ...state.work.map(item => [item.id, item.name, item.tool, item.owner, item.status, item.timestamp]),
  ]);
}
function navigate(next, push = true) {
  if (next === state.view) return;
  if (push && location.hash !== `#${next}`) history.pushState(null, "", `#${next}`);
  state.view = next;
  const content = $("#content");
  const swap = () => { renderView(); };
  if (state.reduced || !window.gsap || !content) swap();
  else gsap.to(content, { opacity: 0, filter: "blur(8px)", duration: .14, ease: "power1.in", onComplete: swap });
  syncHead();
  syncDock();
}
function restoreFromHash() { navigate(validView(location.hash.slice(1)), false); }

/* ---------- boot ---------- */
$("#app").innerHTML = shellHTML();
lucide.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.75 } });

$("#app").addEventListener("click", event => {
  const viewLink = event.target.closest("a[data-view]");
  if (viewLink && !event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
    event.preventDefault();
    navigate(viewLink.dataset.view);
    return;
  }
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "theme") {
    state.theme = state.theme === "light" ? "dark" : "light";
    $("#gdApp").dataset.theme = state.theme;
    const button = $('[data-action="theme"]');
    button.innerHTML = icon(state.theme === "light" ? "moon" : "sun");
    button.setAttribute("title", state.theme === "light" ? "Switch to dark theme" : "Switch to light theme");
    lucide.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.75 } });
  } else if (action === "search") openSearchDialog();
  else if (action === "notifications") { state.readNotices = true; syncDock(); openNotificationsDialog(); }
  else if (action === "close-dialog") $("#gdDialog")?.close();
  else if (action === "export") state.view === "operations" ? downloadWork() : downloadReport();
});

$("#content").addEventListener("click", event => {
  const period = event.target.closest("[data-period]");
  if (period) {
    state.period = period.dataset.period;
    $$("[data-period]").forEach(button => button.setAttribute("aria-pressed", String(button === period)));
    renderView();
  }
});
$("#viewHead").addEventListener("click", event => {
  const period = event.target.closest("[data-period]");
  if (period) {
    state.period = period.dataset.period;
    renderView();
  }
  const exportBtn = event.target.closest("[data-action='export']");
  if (exportBtn) downloadReport();
});

addEventListener("hashchange", restoreFromHash);
addEventListener("popstate", restoreFromHash);
const observer = new ResizeObserver(positionIndicators);
$$(".gd-dock").forEach(nav => {
  observer.observe(nav);
  $$("a", nav).forEach(link => observer.observe(link));
});

renderView();
</script>
